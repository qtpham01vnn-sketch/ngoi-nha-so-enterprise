<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lên Kịch Bản Minigame Bán Hàng - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-pink-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-pink-400 flex items-center gap-3">
          <i class="fa-solid fa-gift"></i> AI Tạo Kịch Bản Minigame & Khuyến Mãi Viral
        </h1>
        <p class="text-sm text-slate-400 mt-1">Kéo tương tác Fanpage & Bùng nổ đơn hàng với thể lệ minigame hấp dẫn</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Loại sản phẩm / Dịch vụ:</label>
          <input id="prodName" value="Thời trang nam cao cấp" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Dịp khuyến mãi:</label>
          <input id="promoEvent" value="Chào hè 2026 - Giảm giá tới 50%" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <button onclick="genGame()" class="w-full py-3 bg-pink-600 hover:bg-pink-500 font-bold text-white rounded-xl shadow-lg transition">Tạo bài đăng Minigame</button>
      </div>

      <div class="card p-6 rounded-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-white text-xs">MẪU BÀI VIẾT FACEBOOK</span>
          <button onclick="copyGame()" class="text-xs text-pink-400 hover:underline"><i class="fa-solid fa-copy"></i> Sao chép</button>
        </div>
        <pre id="gameOut" class="whitespace-pre-wrap font-sans text-xs text-slate-300 leading-relaxed bg-slate-900/80 p-4 rounded-xl border border-slate-800"></pre>
      </div>
    </div>
  </div>

  <script>
    function genGame() {
      const p = document.getElementById('prodName').value;
      const e = document.getElementById('promoEvent').value;
      const text = `🎉 [MINIGAME CỰC HOT]: ĐOÁN ĐÚNG TRÚNG QUÀ KHỦNG 🎁

Chào đón ${e}, shop xin gửi tặng 03 phần quà ${p} trị giá 1.500.000đ cho 3 bạn may mắn nhất!

👉 THỂ LỆ THAM GIA SIÊU DỄ:
1. Like & Share bài viết này ở chế độ công khai.
2. Comment 2 chữ số may mắn (00 - 99) + Tag 3 người bạn thân.

🏆 GIẢI THƯỞNG:
- 01 Giải Nhất: Bộ quà tặng cao cấp trị giá 1.500.000đ.
- 02 Giải Nhì: Voucher mua hàng trị giá 500.000đ.

⏰ Kết quả dựa trên 2 số cuối Giải Đặc Biệt XSMB ngày Chủ Nhật tới. Chơi ngay kẻo lỡ!`;
      document.getElementById('gameOut').innerText = text;
    }
    function copyGame() {
      navigator.clipboard.writeText(document.getElementById('gameOut').innerText);
      alert('Đã sao chép bài viết minigame!');
    }
    genGame();
  </script>
</body>
</html>
