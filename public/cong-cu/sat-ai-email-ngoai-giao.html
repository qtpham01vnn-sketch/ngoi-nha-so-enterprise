<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Soạn Email Ngoại Giao - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-blue-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-blue-400 flex items-center gap-3">
          <i class="fa-solid fa-feather"></i> AI Soạn Thảo Email Ngoại Giao Cấp Cao
        </h1>
        <p class="text-sm text-slate-400 mt-1">Chuẩn hóa thư mời hợp tác, thư cảm ơn VIP, thư từ chối khéo léo và kết nối lãnh đạo</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Mục đích gửi thư ngoại giao:</label>
          <select id="emailType" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
            <option value="invite">Thư mời VIP dự Hội nghị cấp cao</option>
            <option value="thank">Thư cảm ơn sau chuyến thăm làm việc</option>
            <option value="reject">Thư từ chối đề xuất hợp tác khéo léo</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Họ tên & Chức danh người nhận:</label>
          <input id="recName" value="Ông Nguyễn Văn Bình - Tổng Giám Đốc Tập đoàn ABC" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <button onclick="genDiplomatic()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold text-white rounded-xl shadow-lg transition">Soạn thư ngoại giao</button>
      </div>

      <div class="card p-6 rounded-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-white text-xs">BẢN SOẢN THẢO NGOẠI GIAO</span>
          <button onclick="copyMail()" class="text-xs text-blue-400 hover:underline"><i class="fa-solid fa-copy"></i> Sao chép</button>
        </div>
        <pre id="mailOut" class="whitespace-pre-wrap font-sans text-xs text-slate-300 leading-relaxed bg-slate-900/80 p-4 rounded-xl border border-slate-800"></pre>
      </div>
    </div>
  </div>

  <script>
    function genDiplomatic() {
      const type = document.getElementById('emailType').value;
      const rec = document.getElementById('recName').value;
      let text = '';
      if (type === 'invite') {
        text = `Kính gửi: ${rec},

Trân trọng kính mời Ông/Bà tới tham dự Hội nghị Thượng đỉnh Chuyển đổi số 2026 với tư cách Khách mời Danh dự.

Sự hiện diện của Ông/Bà là niềm vinh hạnh to lớn cho chúng tôi và sẽ góp phần quan trọng vào sự thành công của sự kiện.

Thời gian: 08:30, Ngày 25 tháng 10 năm 2026
Địa điểm: Trung tâm Hội nghị Quốc gia, Hà Nội.

Kính chúc Ông/Bà dồi dào sức khỏe và luôn thành công trên cương vị lãnh đạo.`;
      } else {
        text = `Kính gửi: ${rec},

Chúng tôi xin gửi lời cảm ơn chân thành và sâu sắc nhất tới Ông/Bà đã dành thời gian quý báu trong buổi làm việc vừa qua.

Chúng tôi rất trân trọng những chia sẻ chiến lược sâu sắc từ Ông/Bà và kỳ vọng sẽ cùng nhau hiện thực hóa các cơ hội hợp tác to lớn trong tương lai gần.

Kính chúc Ông/Bà và Quý tập đoàn ngày càng thịnh vượng!`;
      }
      document.getElementById('mailOut').innerText = text;
    }
    function copyMail() {
      navigator.clipboard.writeText(document.getElementById('mailOut').innerText);
      alert('Đã sao chép thư ngoại giao!');
    }
    genDiplomatic();
  </script>
</body>
</html>
