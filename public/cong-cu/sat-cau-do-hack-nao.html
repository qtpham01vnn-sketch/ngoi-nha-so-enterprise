<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câu Đố Vui Hack Não - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-lg w-full space-y-6 text-center">
    <div class="card p-6 rounded-2xl border-l-4 border-yellow-500 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-xl font-black text-yellow-400 flex items-center gap-2">
          <i class="fa-solid fa-brain"></i> Câu Đố Dân Gian & Hack Não
        </h1>
        <p class="text-xs text-slate-400 mt-1">Thử thách trí thông minh & tiếng cười sảng khoái</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-8 rounded-3xl space-y-6">
      <div id="riddleQuestion" class="text-lg font-bold text-white leading-relaxed">
        "Cái gì mà bạn sở hữu, nhưng người khác lại dùng nhiều hơn bạn?"
      </div>

      <div id="riddleAnswer" class="p-4 bg-yellow-950/40 border border-yellow-700/50 rounded-xl text-yellow-300 font-black text-base hidden">
        👉 Đáp án: Tên của bạn!
      </div>

      <div class="flex justify-center gap-3">
        <button onclick="toggleAns()" class="px-5 py-2.5 bg-yellow-600 hover:bg-yellow-500 text-slate-950 font-bold rounded-xl text-xs transition">Xem đáp án</button>
        <button onclick="nextRiddle()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition">Câu tiếp theo →</button>
      </div>
    </div>
  </div>

  <script>
    const riddles = [
      { q: "Cái gì mà bạn sở hữu, nhưng người khác lại dùng nhiều hơn bạn?", a: "Tên của bạn!" },
      { q: "Bỏ ngoài nướng trong, ăn ngoài bỏ trong là gì?", a: "Bắp ngô (Bắp nướng)!" },
      { q: "Cái gì đen khi mua, đỏ khi dùng và xám xịt khi vứt đi?", a: "Than củi!" },
      { q: "Con gì đập thì sống, không đập thì chết?", a: "Con tim!" }
    ];
    let idx = 0;
    function toggleAns() {
      document.getElementById('riddleAnswer').classList.toggle('hidden');
    }
    function nextRiddle() {
      idx = (idx + 1) % riddles.length;
      document.getElementById('riddleQuestion').innerText = riddles[idx].q;
      document.getElementById('riddleAnswer').innerText = '👉 Đáp án: ' + riddles[idx].a;
      document.getElementById('riddleAnswer').classList.add('hidden');
    }
  </script>
</body>
</html>
