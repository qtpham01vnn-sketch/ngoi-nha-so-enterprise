<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bấm Giờ Nấu Ăn — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88; --danger: #b91c1c;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; }
    .app-wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .timer-card { background: var(--bg-surface); border: 2px solid var(--border-subtle); border-radius: 12px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .timer-card.running { border-color: var(--accent); }
    .timer-card.finished { border-color: var(--danger); background: #fef2f2; }
    .timer-val { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .btn { padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; min-height: 40px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .form-input { padding: 8px 12px; border: 1px solid var(--border-subtle); border-radius: 6px; font-size: 14px; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C18 • Bấm giờ nhiều món</span>
    </nav>
    <div style="font-size:22px; font-weight:700; margin-bottom:16px;">Đồng hồ hẹn giờ nấu ăn</div>
    <div id="timers-list"></div>
    <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; padding:16px; margin-top:16px; display:flex; gap:8px;">
      <input type="text" class="form-input" id="inp-name" placeholder="Tên món (vd: Luộc trứng)" style="flex:2;">
      <input type="number" class="form-input" id="inp-mins" placeholder="Phút" style="flex:1;" value="8">
      <button class="btn btn-primary" id="btn-add">+ Thêm đồng hồ</button>
    </div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    let timers = [
      { id: 1, name: 'Luộc trứng lòng đào', totalSecs: 360, remain: 360, running: false },
      { id: 2, name: 'Hầm canh xương', totalSecs: 1800, remain: 1800, running: false }
    ];
    function fmt(s) { const m = Math.floor(s/60), sec = s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
    function render() {
      document.getElementById('timers-list').innerHTML = timers.map(t => `
        <div class="timer-card ${t.running ? 'running' : ''} ${t.remain <= 0 ? 'finished' : ''}">
          <div>
            <strong>${t.name}</strong>
            <div class="timer-val">${t.remain <= 0 ? 'XONG!' : fmt(t.remain)}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-primary" onclick="toggleTimer(${t.id})">${t.running ? 'Tạm dừng' : 'Bắt đầu'}</button>
            <button class="btn" style="background:var(--bg-subtle);" onclick="resetTimer(${t.id})">Đặt lại</button>
            <button class="btn" style="background:transparent; color:var(--danger);" onclick="delTimer(${t.id})">✕</button>
          </div>
        </div>
      `).join('');
    }
    window.toggleTimer = function(id) { const t = timers.find(x => x.id === id); if(t) t.running = !t.running; render(); };
    window.resetTimer = function(id) { const t = timers.find(x => x.id === id); if(t) { t.remain = t.totalSecs; t.running = false; } render(); };
    window.delTimer = function(id) { timers = timers.filter(x => x.id !== id); render(); };
    document.getElementById('btn-add').addEventListener('click', () => {
      const name = document.getElementById('inp-name').value.trim() || 'Món mới';
      const mins = Math.max(1, parseInt(document.getElementById('inp-mins').value, 10) || 5);
      timers.push({ id: Date.now(), name, totalSecs: mins*60, remain: mins*60, running: false });
      render();
    });
    setInterval(() => {
      let changed = false;
      timers.forEach(t => { if(t.running && t.remain > 0) { t.remain--; changed = true; if(t.remain === 0) alert(`Món [${t.name}] đã xong!`); } });
      if(changed) render();
    }, 1000);
    render();
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
