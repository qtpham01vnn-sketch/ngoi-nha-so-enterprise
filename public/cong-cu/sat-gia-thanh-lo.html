<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính Giá Thành Sản Xuất Theo Lô - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-teal-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-teal-400 flex items-center gap-3">
          <i class="fa-solid fa-boxes-stacked"></i> Tính Giá Thành Theo Lô & Đơn Giá Bán
        </h1>
        <p class="text-sm text-slate-400 mt-1">Định phí + Biến phí + Biên lợi nhuận mong muốn</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <h2 class="font-bold text-white border-b border-slate-700 pb-2">Chi phí sản xuất lô hàng</h2>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Số lượng sản phẩm trong lô (cái)</label>
          <input id="batchQty" type="number" value="1000" min="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Chi phí nguyên vật liệu trực tiếp (VNĐ)</label>
          <input id="matCost" type="number" value="50000000" step="1000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Chi phí nhân công sản xuất (VNĐ)</label>
          <input id="laborCost" type="number" value="20000000" step="1000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Chi phí bao bì, vận chuyển & hao hụt (VNĐ)</label>
          <input id="pkgCost" type="number" value="10000000" step="500000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Biên lợi nhuận mục tiêu (%)</label>
          <input id="margin" type="number" value="40" step="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <button onclick="calcCost()" class="w-full py-3 bg-teal-600 hover:bg-teal-500 font-bold text-white rounded-xl transition">Tính đơn giá bán</button>
      </div>

      <div class="card p-6 rounded-2xl space-y-6">
        <div class="grid grid-cols-2 gap-3">
          <div class="card p-4 rounded-xl text-center">
            <div class="text-xs text-slate-400">Giá vốn / Sản phẩm</div>
            <div id="costPerUnit" class="text-xl font-black text-rose-400 mt-1">80,000 đ</div>
          </div>
          <div class="card p-4 rounded-xl text-center border border-teal-500/40 bg-teal-950/20">
            <div class="text-xs text-teal-300">Giá bán đề xuất</div>
            <div id="sellPrice" class="text-xl font-black text-teal-400 mt-1">133,333 đ</div>
          </div>
        </div>

        <div class="space-y-2 text-xs">
          <div class="flex justify-between p-2 bg-slate-900/60 rounded-lg">
            <span class="text-slate-400">Tổng chi phí sản xuất cả lô:</span>
            <span id="totalCost" class="font-bold text-white">80,000,000 đ</span>
          </div>
          <div class="flex justify-between p-2 bg-slate-900/60 rounded-lg">
            <span class="text-slate-400">Tổng doanh thu dự kiến:</span>
            <span id="totalRev" class="font-bold text-white">133,333,333 đ</span>
          </div>
          <div class="flex justify-between p-2 bg-emerald-950/50 rounded-lg font-bold text-emerald-400">
            <span>Tổng lợi nhuận gộp lô hàng:</span>
            <span id="grossProfit">53,333,333 đ</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fmt(n) { return Math.round(n).toLocaleString('vi-VN') + ' đ'; }
    function calcCost() {
      const qty = parseInt(document.getElementById('batchQty').value) || 1;
      const mat = parseFloat(document.getElementById('matCost').value) || 0;
      const labor = parseFloat(document.getElementById('laborCost').value) || 0;
      const pkg = parseFloat(document.getElementById('pkgCost').value) || 0;
      const m = (parseFloat(document.getElementById('margin').value) || 0) / 100;

      const total = mat + labor + pkg;
      const unitCost = total / qty;
      const targetSell = unitCost / (1 - m);
      const totalRevenue = targetSell * qty;
      const profit = totalRevenue - total;

      document.getElementById('costPerUnit').innerText = fmt(unitCost);
      document.getElementById('sellPrice').innerText = fmt(targetSell);
      document.getElementById('totalCost').innerText = fmt(total);
      document.getElementById('totalRev').innerText = fmt(totalRevenue);
      document.getElementById('grossProfit').innerText = fmt(profit);
    }
    document.querySelectorAll('input').forEach(el => el.addEventListener('input', calcCost));
    calcCost();
  </script>
</body>
</html>
