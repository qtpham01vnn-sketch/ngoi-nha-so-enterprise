<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Tính Lãi Suất Kép - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-indigo-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-indigo-400 flex items-center gap-3">
          <i class="fa-solid fa-chart-line"></i> Bảng Tính Lãi Suất Kép & Tích Lũy
        </h1>
        <p class="text-sm text-slate-400 mt-1">Sức mạnh của kỳ quan thứ 8: Vốn ban đầu + Gửi định kỳ hàng tháng</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <h2 class="font-bold text-white border-b border-slate-700 pb-2">Kế hoạch tích lũy</h2>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Số vốn ban đầu (VNĐ)</label>
          <input id="initCapital" type="number" value="100000000" step="10000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Gửi thêm hàng tháng (VNĐ)</label>
          <input id="monthlyDeposit" type="number" value="5000000" step="500000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Thời gian đầu tư (Năm)</label>
          <input id="years" type="number" value="10" min="1" max="40" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Lãi suất kỳ vọng (%/năm)</label>
          <input id="interestRate" type="number" value="12" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none focus:border-indigo-500">
        </div>
        <button onclick="calcCompound()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold text-white rounded-xl shadow-lg transition">
          <i class="fa-solid fa-bolt"></i> Tính toán tài sản
        </button>
      </div>

      <div class="md:col-span-2 space-y-6">
        <div class="grid grid-cols-3 gap-3">
          <div class="card p-4 rounded-xl text-center">
            <div class="text-xs text-slate-400">Tổng vốn tự bỏ</div>
            <div id="resTotalPrincipal" class="text-sm md:text-base font-black text-slate-200 mt-1">700,000,000 đ</div>
          </div>
          <div class="card p-4 rounded-xl text-center">
            <div class="text-xs text-slate-400">Tiền lãi sinh ra</div>
            <div id="resTotalInterest" class="text-sm md:text-base font-black text-emerald-400 mt-1">684,562,385 đ</div>
          </div>
          <div class="card p-4 rounded-xl text-center border border-indigo-500/30 bg-indigo-950/20">
            <div class="text-xs text-indigo-300">Tổng tài sản</div>
            <div id="resTotalAmount" class="text-sm md:text-base font-black text-indigo-400 mt-1">1,384,562,385 đ</div>
          </div>
        </div>

        <div class="card p-6 rounded-2xl">
          <h3 class="font-bold text-white mb-3 flex items-center gap-2">
            <i class="fa-solid fa-chart-column text-indigo-400"></i> Tiến trình tăng trưởng từng năm
          </h3>
          <div class="overflow-x-auto max-h-72 overflow-y-auto rounded-xl border border-slate-800">
            <table class="w-full text-xs text-left text-slate-300">
              <thead class="bg-slate-900 text-slate-400 sticky top-0 uppercase">
                <tr>
                  <th class="p-3">Năm</th>
                  <th class="p-3">Gốc tích lũy</th>
                  <th class="p-3">Lãi sinh thêm</th>
                  <th class="p-3">Tổng tài sản</th>
                </tr>
              </thead>
              <tbody id="compoundTableBody" class="divide-y divide-slate-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fmt(n) { return Math.round(n).toLocaleString('vi-VN') + ' đ'; }

    function calcCompound() {
      const init = parseFloat(document.getElementById('initCapital').value) || 0;
      const monthly = parseFloat(document.getElementById('monthlyDeposit').value) || 0;
      const years = parseInt(document.getElementById('years').value) || 1;
      const r = (parseFloat(document.getElementById('interestRate').value) || 0) / 100;
      const rMonthly = r / 12;

      let balance = init;
      let totalInvested = init;
      let rows = '';

      for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
          const intThisMonth = balance * rMonthly;
          balance += intThisMonth + monthly;
          totalInvested += monthly;
        }
        rows += `<tr class="hover:bg-slate-800/40">
          <td class="p-3 font-bold text-white">Năm ${y}</td>
          <td class="p-3">${fmt(totalInvested)}</td>
          <td class="p-3 text-emerald-400">+${fmt(balance - totalInvested)}</td>
          <td class="p-3 font-bold text-indigo-300">${fmt(balance)}</td>
        </tr>`;
      }

      document.getElementById('resTotalPrincipal').innerText = fmt(totalInvested);
      document.getElementById('resTotalInterest').innerText = fmt(balance - totalInvested);
      document.getElementById('resTotalAmount').innerText = fmt(balance);
      document.getElementById('compoundTableBody').innerHTML = rows;
    }

    document.querySelectorAll('input').forEach(inp => inp.addEventListener('input', calcCompound));
    calcCompound();
  </script>
</body>
</html>
