<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trò Chơi Thật Hay Thách - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-lg w-full space-y-6 text-center">
    <div class="card p-6 rounded-2xl border-l-4 border-pink-500 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-xl font-black text-pink-400 flex items-center gap-2">
          <i class="fa-solid fa-masks-theater"></i> Truth or Dare (Thật Hay Thách)
        </h1>
        <p class="text-xs text-slate-400 mt-1">Trò chơi khuấy động không khí cặp đôi & bàn tiệc</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-8 rounded-3xl space-y-6">
      <div class="flex justify-center gap-4">
        <button onclick="getTruth()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 font-black text-white rounded-xl shadow-lg transition">SỰ THẬT (TRUTH)</button>
        <button onclick="getDare()" class="px-6 py-3 bg-rose-600 hover:bg-rose-500 font-black text-white rounded-xl shadow-lg transition">THỬ THÁCH (DARE)</button>
      </div>

      <div id="questBox" class="p-6 bg-slate-900/90 border border-slate-700 rounded-2xl text-base font-bold text-white min-h-[100px] flex items-center justify-center">
        Bấm chọn "Sự Thật" hoặc "Thử Thách" để bắt đầu!
      </div>
    </div>
  </div>

  <script>
    const truths = [
      'Điều gì bạn chưa từng dám kể với người đối diện?',
      'Kỷ niệm đáng xấu hổ nhất thời đi học của bạn là gì?',
      'Mối tình đầu của bạn diễn ra vào năm bao nhiêu tuổi?',
      'Nếu được đổi một thói quen của đối phương, bạn muốn đổi điều gì?',
      'Khoảnh khắc lãng mạn nhất bạn từng trải qua là khi nào?'
    ];
    const dares = [
      'Hát một đoạn điệp khúc bài hát bạn thích nhất bằng giọng trẻ con.',
      'Gọi điện cho một người bạn và nói: "Tôi vừa trúng số 2 tỷ!" rồi cúp máy.',
      'Nhảy một điệu nhảy ngẫu hứng trong 30 giây.',
      'Khen người đối diện 3 câu thật lòng nhất.',
      'Chụp một bức ảnh dìm hài hước và gửi vào nhóm bạn thân.'
    ];
    function getTruth() {
      const q = truths[Math.floor(Math.random() * truths.length)];
      document.getElementById('questBox').innerHTML = `<span class="text-sky-300">💙 SỰ THẬT:</span><br>${q}`;
    }
    function getDare() {
      const q = dares[Math.floor(Math.random() * dares.length)];
      document.getElementById('questBox').innerHTML = `<span class="text-rose-400">🔥 THỬ THÁCH:</span><br>${q}`;
    }
  </script>
</body>
</html>
