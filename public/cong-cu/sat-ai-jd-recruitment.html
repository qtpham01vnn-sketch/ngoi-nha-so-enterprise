<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tạo JD Tuyển Dụng Chuyên Nghiệp - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-teal-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-teal-400 flex items-center gap-3">
          <i class="fa-solid fa-user-plus"></i> AI Tạo Mô Tả Công Việc (JD) Thu Hút Nhân Tài
        </h1>
        <p class="text-sm text-slate-400 mt-1">Tự động cấu trúc JD chuẩn: Trách nhiệm, Yêu cầu năng lực & Chế độ đãi ngộ</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Vị trí tuyển dụng:</label>
          <input id="jdRole" value="Trưởng Phòng Kinh Doanh (Sales Manager)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Mức lương dự kiến:</label>
          <input id="jdSalary" value="25 - 40 Triệu + Hoa hồng KPI" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <button onclick="genJD()" class="w-full py-3 bg-teal-600 hover:bg-teal-500 font-bold text-white rounded-xl shadow-lg transition">Tạo JD chuẩn</button>
      </div>

      <div class="card p-6 rounded-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-white text-xs">XEM TRƯỚC JD</span>
          <button onclick="copyJD()" class="text-xs text-teal-400 hover:underline"><i class="fa-solid fa-copy"></i> Sao chép JD</button>
        </div>
        <pre id="jdOutput" class="whitespace-pre-wrap font-sans text-xs text-slate-300 leading-relaxed bg-slate-900/80 p-4 rounded-xl border border-slate-800"></pre>
      </div>
    </div>
  </div>

  <script>
    function genJD() {
      const role = document.getElementById('jdRole').value;
      const sal = document.getElementById('jdSalary').value;
      const content = `TUYỂN DỤNG: ${role.toUpperCase()}
Mức thu nhập: ${sal}
Địa điểm làm việc: Hà Nội / TP.HCM

1. MÔ TẢ CÔNG VIỆC:
- Xây dựng và triển khai chiến lược kinh doanh nhằm đạt mục tiêu doanh số của công ty.
- Quản lý, đào tạo và phát triển đội ngũ chuyên viên kinh doanh thiện chiến.
- Trực tiếp đàm phán, chốt hợp đồng với các đối tác và khách hàng trọng điểm (B2B/Enterprise).

2. YÊU CẦU ỨNG VIÊN:
- Có tối thiểu 2-3 năm kinh nghiệm tại vị trí tương đương.
- Kỹ năng đàm phán, thuyết phục và tư duy chiến lược xuất sắc.
- Tinh thần trách nhiệm cao, máu lửa và chịu được áp lực chỉ tiêu KPI.

3. QUYỀN LỢI & CHẾ ĐỘ:
- Lương cứng cạnh tranh + Thưởng doanh số không giới hạn.
- Đóng BHXH đầy đủ theo luật định + Bảo hiểm sức khỏe cao cấp.
- Lộ trình thăng tiến lên Giám đốc Kinh doanh (CCO) rõ ràng.`;
      document.getElementById('jdOutput').innerText = content;
    }
    function copyJD() {
      navigator.clipboard.writeText(document.getElementById('jdOutput').innerText);
      alert('Đã sao chép nội dung JD!');
    }
    genJD();
  </script>
</body>
</html>
