<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồ Đến Trường Theo Thứ — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; }
    .app-wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .tab-days { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 20px; }
    .tab-day-btn { padding: 8px 14px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; min-height: 40px; }
    .tab-day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .item-check { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); font-size: 15px; cursor: pointer; }
    .item-check:last-child { border-bottom: none; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C39 • Đồ đến trường</span>
    </nav>
    <div style="font-size:22px; font-weight:700; margin-bottom:16px;">Soạn đồ đi học theo thời khóa biểu</div>
    <div class="tab-days" id="days-tabs"></div>
    <div class="card">
      <div style="font-size:16px; font-weight:700; margin-bottom:12px;" id="current-day-title">Thứ Hai cần mang:</div>
      <div id="items-checklist"></div>
    </div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    const days = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu'];
    const data = {
      'Thứ Hai': ['Mặc đồng phục chào cờ', 'Sách Toán tập 1', 'Vở Tiếng Việt', 'Khăn quàng đỏ', 'Bình nước cá nhân'],
      'Thứ Ba': ['Đồng phục thể dục', 'Giày bata thể thao', 'Sách Khoa học', 'Hộp bút sáp màu', 'Bình nước cá nhân'],
      'Thứ Tư': ['Đồng phục thường', 'Sách Tiếng Anh', 'Vở bài tập Toán', 'Bộ que tính', 'Bình nước cá nhân'],
      'Thứ Năm': ['Đồng phục thường', 'Dụng cụ thủ công (kéo, hồ dán)', 'Sách Lịch sử', 'Bình nước cá nhân'],
      'Thứ Sáu': ['Đồng phục thể dục', 'Sách Âm nhạc', 'Vở vẽ A4', 'Sổ liên lạc', 'Bình nước cá nhân']
    };
    let curDay = 'Thứ Hai';
    function render() {
      document.getElementById('days-tabs').innerHTML = days.map(d => `
        <button class="tab-day-btn ${d === curDay ? 'active' : ''}" onclick="selectDay('${d}')">${d}</button>
      `).join('');
      document.getElementById('current-day-title').textContent = `${curDay} cần mang:`;
      const list = data[curDay] || [];
      document.getElementById('items-checklist').innerHTML = list.map(item => `
        <div class="item-check" onclick="this.querySelector('input').checked = !this.querySelector('input').checked">
          <input type="checkbox" style="width:18px; height:18px;">
          <span>${item}</span>
        </div>
      `).join('');
    }
    window.selectDay = function(d) { curDay = d; render(); };
    render();
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
