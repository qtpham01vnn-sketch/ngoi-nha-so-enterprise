<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Soạn Vali Du Lịch Thông Minh - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-sky-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-sky-400 flex items-center gap-3">
          <i class="fa-solid fa-suitcase-rolling"></i> Checklist Soạn Vali Du Lịch Thông Minh
        </h1>
        <p class="text-sm text-slate-400 mt-1">Chuẩn bị hành lý theo loại hình chuyến đi: Biển, Leo núi, Công tác, Quốc tế</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="flex gap-2 flex-wrap">
      <button onclick="loadType('beach')" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-umbrella-beach"></i> Đi Biển Nghỉ Dưỡng</button>
      <button onclick="loadType('mountain')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs"><i class="fa-solid fa-mountain"></i> Đi Phượt / Leo Núi</button>
      <button onclick="loadType('business')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs"><i class="fa-solid fa-briefcase"></i> Đi Công Tác</button>
      <button onclick="loadType('abroad')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs"><i class="fa-solid fa-plane-departure"></i> Du Lịch Nước Ngoài</button>
    </div>

    <div class="card p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 id="packTitle" class="font-bold text-white text-lg flex items-center gap-2">Danh mục đồ cần xếp vào vali:</h2>
        <span id="packProgress" class="text-xs px-3 py-1 bg-sky-950 text-sky-400 rounded-lg font-bold">Đã chuẩn bị 0/0</span>
      </div>
      <div id="packList" class="grid md:grid-cols-2 gap-3 text-sm"></div>
    </div>
  </div>

  <script>
    const presets = {
      beach: {
        title: '🏖️ Hành lý đi Biển & Nghỉ Dưỡng',
        items: ['CCCD / Hộ chiếu & Vé máy bay', 'Đồ bơi & Khăn tắm biển', 'Kem chống nắng SPF 50+ & Xịt khoáng', 'Kính râm & Mũ rộng vành', 'Dép xỏ ngón & Túi chống nước cho điện thoại', 'Sạc dự phòng & Tai nghe', 'Váy maxi / Áo sơ mi hoa', 'Thuốc đau bụng & Băng cá nhân']
      },
      mountain: {
        title: '⛰️ Hành lý Phượt & Leo Núi',
        items: ['Giày trekking chống trượt', 'Áo gió chống nước & Áo giữ nhiệt', 'Balo leo núi có đai trợ lực', 'Gậy leo núi & Găng tay bảo hộ', 'Đèn pin siêu sáng & Pin dự phòng', 'Thuốc xịt côn trùng & Băng bó cơ', 'Lương khô & Nước bù khoáng điện giải', 'Bật lửa & Dao đa năng']
      },
      business: {
        title: '💼 Hành lý Đi Công Tác Chuyên Nghiệp',
        items: ['Laptop, sạc máy tính & Chuột', 'Áo sơ mi là phẳng & Quần tây / Vest', 'Danh thiếp (Namecard)', 'Sổ tay ghi chép & Bút ký', 'Bàn ủi du lịch gấp gọn', 'Nước hoa & Lăn khử mùi', 'Cáp HDMI / Đầu chuyển trình chiếu', 'Giày tây / Giày cao gót thanh lịch']
      },
      abroad: {
        title: '✈️ Hành lý Du Lịch Quốc Tế',
        items: ['Hộ chiếu (còn hạn > 6 tháng) & Visa', 'Thẻ tín dụng quốc tế Visa/Mastercard', 'Tiền mặt ngoại tệ của nước sở tại', 'Củ sạc chuyển đổi chân đa năng (Universal Plug)', 'Sim 4G du lịch hoặc eSIM', 'Bảo hiểm du lịch quốc tế', 'Áo ấm dày (nếu đi xứ lạnh)', 'Bản in xác nhận đặt phòng khách sạn']
      }
    };

    function loadType(key) {
      const data = presets[key];
      document.getElementById('packTitle').innerText = data.title;
      const container = document.getElementById('packList');
      container.innerHTML = data.items.map((item, idx) => `
        <label class="flex items-center gap-3 p-3 bg-slate-900/60 rounded-xl border border-slate-800 hover:border-slate-700 cursor-pointer">
          <input type="checkbox" onchange="updateProgress()" class="w-4 h-4 rounded text-sky-500 bg-slate-800 border-slate-700">
          <span class="text-slate-200 text-xs">${item}</span>
        </label>
      `).join('');
      updateProgress();
    }

    function updateProgress() {
      const all = document.querySelectorAll('#packList input[type="checkbox"]');
      const checked = document.querySelectorAll('#packList input[type="checkbox"]:checked');
      document.getElementById('packProgress').innerText = `Đã chuẩn bị ${checked.length}/${all.length}`;
    }

    loadType('beach');
  </script>
</body>
</html>
