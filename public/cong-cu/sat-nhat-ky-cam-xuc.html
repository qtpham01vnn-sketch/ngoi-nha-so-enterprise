<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật Ký Cảm Xúc & Mood Tracker - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-pink-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-pink-400 flex items-center gap-3">
          <i class="fa-solid fa-heart-pulse"></i> Nhật Ký Cảm Xúc & Tâm Trạng Hôm Nay
        </h1>
        <p class="text-sm text-slate-400 mt-1">Lắng nghe nội tâm, giải tỏa ức chế và ghi nhận khoảnh khắc biết ơn mỗi ngày</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="card p-6 rounded-2xl space-y-4">
      <h2 class="font-bold text-white text-sm">Hôm nay tâm trạng của bạn thế nào?</h2>
      <div class="grid grid-cols-5 gap-2 text-center">
        <button onclick="setMood('Tuyệt vời 😄', 'emerald')" class="p-3 bg-slate-900 border border-slate-700 rounded-xl hover:border-emerald-500 transition">
          <div class="text-2xl">😄</div>
          <div class="text-xs text-slate-300 mt-1">Rất vui</div>
        </button>
        <button onclick="setMood('Bình yên 🌿', 'sky')" class="p-3 bg-slate-900 border border-slate-700 rounded-xl hover:border-sky-500 transition">
          <div class="text-2xl">🌿</div>
          <div class="text-xs text-slate-300 mt-1">Bình yên</div>
        </button>
        <button onclick="setMood('Bình thường 😐', 'slate')" class="p-3 bg-slate-900 border border-slate-700 rounded-xl hover:border-slate-500 transition">
          <div class="text-2xl">😐</div>
          <div class="text-xs text-slate-300 mt-1">Ổn định</div>
        </button>
        <button onclick="setMood('Mệt mỏi 😫', 'amber')" class="p-3 bg-slate-900 border border-slate-700 rounded-xl hover:border-amber-500 transition">
          <div class="text-2xl">😫</div>
          <div class="text-xs text-slate-300 mt-1">Mệt mỏi</div>
        </button>
        <button onclick="setMood('Căng thẳng 😡', 'rose')" class="p-3 bg-slate-900 border border-slate-700 rounded-xl hover:border-rose-500 transition">
          <div class="text-2xl">😡</div>
          <div class="text-xs text-slate-300 mt-1">Áp lực</div>
        </button>
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">3 điều bạn cảm thấy biết ơn hoặc tâm đắc hôm nay:</label>
        <textarea id="gratitudeText" rows="3" placeholder="vd: Được ăn bữa cơm ấm cùng gia đình, hoàn thành xong dự án lớn..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-xs outline-none focus:border-pink-500"></textarea>
      </div>

      <div class="flex justify-end">
        <button onclick="saveMood()" class="px-5 py-2.5 bg-pink-600 hover:bg-pink-500 font-bold text-white rounded-xl text-xs transition">Lưu nhật ký</button>
      </div>
    </div>

    <div class="card p-6 rounded-2xl space-y-3">
      <h3 class="font-bold text-white text-sm flex items-center gap-2">
        <i class="fa-solid fa-clock-rotate-left text-pink-400"></i> Lịch sử cảm xúc gần đây
      </h3>
      <div id="moodLogs" class="space-y-2 text-xs">
        <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center">
          <div>
            <span class="font-bold text-emerald-400">😄 Tuyệt vời</span>
            <p class="text-slate-400 mt-0.5">"Cả nhà cùng đi dạo công viên, không khí rất trong lành."</p>
          </div>
          <span class="text-slate-500 text-xs">Hôm qua</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentMood = 'Tuyệt vời 😄';
    function setMood(m) { currentMood = m; alert('Đã chọn: ' + m); }
    function saveMood() {
      const text = document.getElementById('gratitudeText').value.trim();
      if (!text) return alert('Vui lòng ghi lại đôi lời tâm sự hôm nay nhé!');
      const container = document.getElementById('moodLogs');
      const item = document.createElement('div');
      item.className = 'p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center';
      item.innerHTML = `<div><span class="font-bold text-pink-400">${currentMood}</span><p class="text-slate-300 mt-0.5">"${text}"</p></div><span class="text-slate-500 text-xs">Vừa xong</span>`;
      container.prepend(item);
      document.getElementById('gratitudeText').value = '';
      alert('Đã lưu cảm xúc thành công!');
    }
  </script>
</body>
</html>
