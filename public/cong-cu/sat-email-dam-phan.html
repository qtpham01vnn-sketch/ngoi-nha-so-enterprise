<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mẫu Email Đàm Phán & Thương Thảo - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-indigo-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-indigo-400 flex items-center gap-3">
          <i class="fa-solid fa-handshake"></i> Kịch Bản Email Đàm Phán & Thương Thảo
        </h1>
        <p class="text-sm text-slate-400 mt-1">Cẩm nang email đàm phán giá cả đối tác, đề xuất tăng lương & giải quyết khiếu nại</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="flex gap-2 flex-wrap">
      <button onclick="loadTemplate('price')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs">Đàm phán giảm giá NCC</button>
      <button onclick="loadTemplate('salary')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs">Đề xuất tăng lương</button>
      <button onclick="loadTemplate('deadline')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs">Xin gia hạn tiến độ</button>
      <button onclick="loadTemplate('complaint')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs">Xử lý khiếu nại khách</button>
    </div>

    <div class="card p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h2 id="emailTitle" class="font-bold text-white text-base">Tiêu đề: Đề xuất xem xét lại mức chiết khấu hợp đồng năm 2026</h2>
        <button onclick="copyMail()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-copy"></i> Sao chép</button>
      </div>
      <pre id="emailBody" class="whitespace-pre-wrap font-sans text-xs text-slate-300 leading-relaxed bg-slate-900/80 p-5 rounded-xl border border-slate-800"></pre>
    </div>
  </div>

  <script>
    const templates = {
      price: {
        title: 'Tiêu đề: Đề xuất xem xét lại mức chiết khấu hợp đồng năm 2026',
        body: `Kính gửi: [Tên Đối Tác / Nhà Cung Cấp],

Trước hết, chúng tôi xin chân thành cảm ơn sự đồng hành và hỗ trợ tận tâm của Quý công ty trong suốt thời gian qua.

Dựa trên kế hoạch mở rộng quy mô kinh doanh và dự kiến tăng trưởng sản lượng đặt hàng thêm 30% trong năm 2026, chúng tôi mong muốn hai bên cùng trao đổi để tối ưu hóa chính sách giá và chiết khấu thương mại.

Cụ thể, chúng tôi đề xuất mức chiết khấu bổ sung [5-8%] cho các đơn hàng đạt hạn mức định kỳ. Điều này sẽ giúp đôi bên gia tăng tính cạnh tranh trên thị trường và gắn kết mối quan hệ hợp tác dài hạn.

Rất mong nhận được phản hồi và có buổi gặp mặt trao đổi chi tiết cùng Quý đối tác.

Trân trọng,
[Tên của bạn]
[Chức vụ & Công ty]`
      },
      salary: {
        title: 'Tiêu đề: Đề xuất xem xét và điều chỉnh chế độ đãi ngộ - [Họ và Tên]',
        body: `Kính gửi: [Tên Trưởng bộ phận / Ban Giám Đốc],

Em xin cảm ơn Anh/Chị và Ban lãnh đạo đã luôn tạo điều kiện và hỗ trợ em hoàn thành tốt các nhiệm vụ trong suốt [Số năm/tháng] gắn bó vừa qua.

Trong giai đoạn vừa qua, em đã nỗ lực đóng góp vào các cột mốc quan trọng như: [Kể ra 2-3 thành tựu định lượng cụ thể: tăng 20% doanh thu, tối ưu 15% chi phí...]. 

Dựa trên khối lượng trách nhiệm hiện tại cũng như mặt bằng thu nhập thị trường, em trân trọng kính đề xuất Anh/Chị xem xét điều chỉnh mức lương của em lên [Mức lương đề xuất] VNĐ.

Em rất mong có cơ hội được lắng nghe ý kiến phản hồi và chia sẻ thêm về định hướng phát triển của bộ phận.

Trân trọng,
[Họ và tên của bạn]`
      },
      deadline: {
        title: 'Tiêu đề: [Dự án X] - Báo cáo tiến độ và đề xuất điều chỉnh ngày bàn giao',
        body: `Kính gửi: [Tên Khách Hàng / Đối Tác],

Đội ngũ chúng tôi đang tập trung cao độ để hoàn thiện các hạng mục của dự án [Tên dự án]. 

Trong quá trình nghiệm thu kỹ thuật nội bộ, nhằm đảm bảo chất lượng sản phẩm đạt tiêu chuẩn vận hành cao nhất và không phát sinh lỗi thực tế, chúng tôi kính đề xuất được gia hạn ngày bàn giao thêm [Số ngày, vd: 3 ngày làm việc], tức ngày [Ngày mới].

Chúng tôi cam kết sẽ hoàn thiện toàn bộ tính năng và bàn giao đúng thời hạn điều chỉnh trên. Rất mong nhận được sự thông cảm và hỗ trợ từ Quý khách hàng.

Trân trọng,
[Tên quản lý dự án]`
      },
      complaint: {
        title: 'Tiêu đề: Thư xin lỗi và phương án giải quyết sự cố - [Tên Công Ty]',
        body: `Kính gửi: Quý khách hàng [Tên Khách Hàng],

Chúng tôi đã tiếp nhận phản hồi của Quý khách liên quan đến sự cố [Nêu sự cố]. Trước hết, chúng tôi xin gửi lời xin lỗi chân thành nhất vì trải nghiệm chưa trọn vẹn này.

Đội ngũ kỹ thuật và chăm sóc khách hàng đã ngay lập tức khắc phục và đưa ra phương án xử lý như sau:
1. Đổi mới/Khắc phục toàn bộ phần phát sinh lỗi trong vòng 24 giờ.
2. Tặng kèm voucher/ưu đãi [Nêu ưu đãi đền bù] như một lời tri ân sự kiên nhẫn của Quý khách.

Sự hài lòng của Quý khách luôn là ưu tiên cao nhất của chúng tôi. Kính chúc Quý khách nhiều niềm vui.

Trân trọng,
[Bộ phận Chăm sóc Khách hàng]`
      }
    };

    function loadTemplate(k) {
      document.getElementById('emailTitle').innerText = templates[k].title;
      document.getElementById('emailBody').innerText = templates[k].body;
    }
    function copyMail() {
      navigator.clipboard.writeText(document.getElementById('emailBody').innerText);
      alert('Đã sao chép nội dung email!');
    }
    loadTemplate('price');
  </script>
</body>
</html>
