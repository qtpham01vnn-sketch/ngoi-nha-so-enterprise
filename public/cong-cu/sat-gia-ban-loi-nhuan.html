<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính Giá Bán & Lợi Nhuận — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88; --success: #15803d;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fs-base: 16px; --fs-hero: 44px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; font-variant-numeric: tabular-nums; }
    .app-wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .hero-card { background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 14px; padding: 24px; text-align: center; margin-bottom: 24px; }
    .hero-label { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 0.05em; }
    .hero-number { font-size: var(--fs-hero); font-weight: 800; line-height: 1.1; margin: 8px 0; color: var(--text-main); }
    .hero-sub { font-size: 15px; color: var(--text-muted); }
    .form-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 20px; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 13px; font-weight: 600; }
    .form-input { padding: 10px 14px; border: 1px solid var(--border-subtle); border-radius: 6px; font-size: 15px; background: #fff; width: 100%; min-height: 44px; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .hero-number { font-size: 32px; } }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C74 • Giá bán & Biên lãi</span>
    </nav>
    <div class="hero-card">
      <div class="hero-label">GIÁ BÁN ĐỀ XUẤT ĐỂ ĐẠT BIÊN LÃI</div>
      <div class="hero-number" id="hero-price">250.000đ</div>
      <div class="hero-sub" id="hero-profit">Lợi nhuận thực: 75.000đ / sản phẩm (Biên lãi 30%)</div>
    </div>
    <div class="form-card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="inp-cogs">1. Giá vốn sản phẩm *</label>
          <input type="text" inputmode="numeric" class="form-input" id="inp-cogs" value="150.000">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-margin">2. Biên lợi nhuận mong muốn (%) *</label>
          <input type="number" min="1" max="90" class="form-input" id="inp-margin" value="30">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-fee">3. Chi phí bán hàng / Phí sàn (%)</label>
          <input type="number" min="0" class="form-input" id="inp-fee" value="10">
        </div>
        <div class="form-group">
          <label class="form-label" for="inp-fixed">4. Chi phí cố định khác (đ/món)</label>
          <input type="text" inputmode="numeric" class="form-input" id="inp-fixed" value="5.000">
        </div>
      </div>
    </div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    function parseMoney(v) { return parseInt(String(v).replace(/\./g,'').replace(/[^\d]/g,''), 10) || 0; }
    function formatMoney(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }

    function calc() {
      const cogs = parseMoney(document.getElementById('inp-cogs').value);
      const targetMargin = (parseFloat(document.getElementById('inp-margin').value) || 0) / 100;
      const feePct = (parseFloat(document.getElementById('inp-fee').value) || 0) / 100;
      const fixedCost = parseMoney(document.getElementById('inp-fixed').value);

      // Công thức: Price * (1 - feePct - targetMargin) = cogs + fixedCost
      // => Price = (cogs + fixedCost) / (1 - feePct - targetMargin)
      const denominator = 1 - feePct - targetMargin;
      if (denominator <= 0) {
        document.getElementById('hero-price').textContent = 'Không khả thi';
        document.getElementById('hero-profit').textContent = 'Tổng phí sàn và biên lãi vượt quá 100%';
        return;
      }

      const price = (cogs + fixedCost) / denominator;
      const profit = price * targetMargin;

      document.getElementById('hero-price').textContent = formatMoney(price);
      document.getElementById('hero-profit').textContent = `Lợi nhuận ròng: ${formatMoney(profit)} (Biên lãi ${(targetMargin*100).toFixed(0)}% sau khi trừ ${formatMoney(price*feePct)} phí bán)`;
    }

    ['inp-cogs', 'inp-margin', 'inp-fee', 'inp-fixed'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        if (id === 'inp-cogs' || id === 'inp-fixed') {
          const num = parseMoney(e.target.value);
          e.target.value = num > 0 ? num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
        }
        calc();
      });
    });

    calc();
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
