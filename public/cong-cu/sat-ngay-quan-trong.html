<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ Ngày Quan Trọng — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; }
    .app-wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .hero-card { background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 14px; padding: 20px; margin-bottom: 24px; }
    .form-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 20px; margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    .form-input { padding: 10px 14px; border: 1px solid var(--border-subtle); border-radius: 6px; font-size: 14px; width: 100%; min-height: 44px; }
    .btn { padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; min-height: 44px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .date-row { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C45 • Ngày quan trọng</span>
    </nav>
    <div class="hero-card">
      <div style="font-size:13px; font-weight:700; color:var(--accent); text-transform:uppercase;">DỊP KỶ NIỆM SẮP TỚI</div>
      <div style="font-size:24px; font-weight:800; margin:6px 0;" id="next-event">Sinh nhật Mẹ (còn 12 ngày)</div>
      <div style="font-size:14px; color:var(--text-muted);">Ghi nhớ sinh nhật, kỷ niệm ngày cưới, khai trương</div>
    </div>
    <div class="form-card">
      <div class="form-grid">
        <input type="text" class="form-input" id="inp-name" placeholder="Tên người / Dịp kỷ niệm">
        <input type="text" class="form-input" id="inp-date" placeholder="Ngày/Tháng (vd: 25/10)">
        <input type="text" class="form-input" id="inp-tag" placeholder="Quan hệ (Bạn bè/Gia đình)">
      </div>
      <button class="btn btn-primary" id="btn-add" style="margin-top:12px; width:100%;">+ Thêm ngày kỷ niệm</button>
    </div>
    <div id="events-list"></div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    const STORAGE_KEY = 'nns_tool_ngay_quan_trong_data';
    let list = [
      { id: 1, name: 'Sinh nhật Mẹ', date: '25/10', tag: 'Gia đình' },
      { id: 2, name: 'Kỷ niệm ngày cưới', date: '15/12', tag: 'Gia đình' }
    ];
    try { const raw = localStorage.getItem(STORAGE_KEY); if(raw) list = JSON.parse(raw); }catch(e){}
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    function render() {
      if (list.length > 0) document.getElementById('next-event').textContent = `${list[0].name} (${list[0].date})`;
      document.getElementById('events-list').innerHTML = list.map((item, idx) => `
        <div class="date-row">
          <div>
            <strong>${item.name}</strong>
            <span style="font-size:12px; color:var(--text-muted); margin-left:6px;">(${item.tag || 'Chung'})</span>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <strong style="color:var(--accent);">${item.date}</strong>
            <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="delEvent(${idx})">✕</button>
          </div>
        </div>
      `).join('');
    }
    window.delEvent = function(idx) { list.splice(idx, 1); save(); render(); };
    document.getElementById('btn-add').addEventListener('click', () => {
      const name = document.getElementById('inp-name').value.trim();
      const date = document.getElementById('inp-date').value.trim();
      const tag = document.getElementById('inp-tag').value.trim();
      if (!name || !date) { alert('Vui lòng nhập tên và ngày!'); return; }
      list.push({ id: Date.now(), name, date, tag });
      save(); render();
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-date').value = '';
    });
    render();
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
