<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Thở 4-7-8 Thư Giãn Sâu - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .breathe-circle { transition: all 4s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-xl w-full space-y-6 text-center">
    <div class="card p-6 rounded-2xl border-l-4 border-teal-500 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-xl font-black text-teal-400 flex items-center gap-2">
          <i class="fa-solid fa-wind"></i> Kỹ Thuật Thở Sâu 4-7-8
        </h1>
        <p class="text-xs text-slate-400 mt-1">Giảm stress trong 60 giây & Giúp đi vào giấc ngủ nhanh</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-8 rounded-3xl flex flex-col items-center justify-center space-y-6">
      <div class="relative flex items-center justify-center w-64 h-64">
        <div id="circle" class="w-40 h-40 bg-teal-500/20 border-2 border-teal-400 rounded-full flex flex-col items-center justify-center shadow-[0_0_50px_rgba(20,184,166,0.3)] breathe-circle">
          <div id="breathText" class="text-xl font-black text-teal-300 uppercase tracking-widest">Sẵn sàng</div>
          <div id="countdown" class="text-3xl font-black text-white mt-1">4</div>
        </div>
      </div>

      <div class="flex gap-4">
        <button id="btnStart" onclick="toggleBreathe()" class="px-8 py-3 bg-teal-600 hover:bg-teal-500 font-bold text-white rounded-xl shadow-lg transition flex items-center gap-2">
          <i class="fa-solid fa-play"></i> Bắt đầu luyện thở
        </button>
      </div>

      <p class="text-xs text-slate-400 max-w-sm">Hít vào bằng mũi trong 4s → Giữ hơi trong 7s → Thở ra từ từ bằng miệng trong 8s.</p>
    </div>
  </div>

  <script>
    let isRunning = false;
    let timer = null;

    function toggleBreathe() {
      if (isRunning) {
        isRunning = false;
        clearInterval(timer);
        document.getElementById('btnStart').innerHTML = '<i class="fa-solid fa-play"></i> Bắt đầu luyện thở';
        document.getElementById('breathText').innerText = 'Sẵn sàng';
        document.getElementById('circle').style.transform = 'scale(1)';
        return;
      }

      isRunning = true;
      document.getElementById('btnStart').innerHTML = '<i class="fa-solid fa-pause"></i> Dừng lại';
      runCycle();
    }

    function runCycle() {
      if (!isRunning) return;
      // Phase 1: Inhale 4s
      const circle = document.getElementById('circle');
      const text = document.getElementById('breathText');
      const count = document.getElementById('countdown');

      text.innerText = 'Hít Vào';
      circle.style.transitionDuration = '4s';
      circle.style.transform = 'scale(1.4)';
      let sec = 4;
      count.innerText = sec;

      let cInt = setInterval(() => {
        sec--;
        if (sec > 0) count.innerText = sec;
        else clearInterval(cInt);
      }, 1000);

      setTimeout(() => {
        if (!isRunning) return;
        // Phase 2: Hold 7s
        text.innerText = 'Giữ Hơi';
        sec = 7;
        count.innerText = sec;
        let cInt2 = setInterval(() => {
          sec--;
          if (sec > 0) count.innerText = sec;
          else clearInterval(cInt2);
        }, 1000);

        setTimeout(() => {
          if (!isRunning) return;
          // Phase 3: Exhale 8s
          text.innerText = 'Thở Ra';
          circle.style.transitionDuration = '8s';
          circle.style.transform = 'scale(1)';
          sec = 8;
          count.innerText = sec;
          let cInt3 = setInterval(() => {
            sec--;
            if (sec > 0) count.innerText = sec;
            else clearInterval(cInt3);
          }, 1000);

          setTimeout(() => {
            if (isRunning) runCycle();
          }, 8000);
        }, 7000);
      }, 4000);
    }
  </script>
</body>
</html>
