<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiết Lập Mục Tiêu OKR & Chỉ Số Đo Lường KPI — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #0b132b; --bg-card: #131f47; --border: rgba(56, 189, 248, 0.2);
      --text: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3);
      --emerald: #10b981; --rose: #f43f5e; --amber: #f59e0b; --indigo: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-page); color: var(--text); padding-bottom: 40px; min-height: 100vh; }
    .app-wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--border); transition: all 0.2s; cursor: pointer; }
    .back-link:hover { background: rgba(56, 189, 248, 0.2); }
    .badge { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-field { width: 100%; padding: 12px 14px; background: #080e22; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
    .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-rose { background: linear-gradient(135deg, #e11d48, #f43f5e); color: #fff; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
    .btn-emerald { background: linear-gradient(135deg, #059669, #10b981); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-amber { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; }
    .btn-copy { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-copy:hover { background: rgba(56, 189, 248, 0.3); }
    .result-box { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; }
    .res-val { font-size: 28px; font-weight: 900; color: #fff; margin: 8px 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    .preset-chip { display: inline-block; background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 99px; font-size: 12px; margin: 4px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: all 0.2s; }
    .preset-chip:hover, .preset-chip.active { background: #38bdf8; color: #0b132b; font-weight: bold; border-color: #38bdf8; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; }
    .task-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a class="back-link" id="btn-back-main">← Quay lại Bảng điều khiển</a>
      <span class="badge">💼 Quản Trị Mục Tiêu</span>
    </nav>
    <div class="card">
      
    <div class="card-title">🎯 Thiết Lập OKR & KPI Phòng Ban Chuẩn Thực Chiến</div>
    <div class="card-desc">Thiết lập Objective (Mục tiêu truyền cảm hứng) + Key Results (Kết quả then chốt đo lường được) kèm thanh theo dõi % hoàn thành.</div>
    <div class="grid-2">
      <div class="input-group">
        <label class="input-label">Chọn phòng ban:</label>
        <select id="okr-dept" class="input-field">
          <option value="sales">Phòng Kinh Doanh / Bán Hàng</option>
          <option value="mkt">Phòng Marketing & Truyền Thông</option>
          <option value="prod">Xưởng Sản Xuất Men & Lò Nung</option>
          <option value="hr">Phòng Nhân Sự & Đào Tạo</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">Mục tiêu kỳ (Quý / Tháng):</label>
        <select id="okr-period" class="input-field">
          <option value="q">Quý này (3 Tháng)</option>
          <option value="m">Tháng này</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-gen-okr">⚡ Nạp Bộ OKR & KPI Mẫu Chuẩn</button>
    <div id="okr-res" class="result-box" style="display:none; text-align:left;">
      <div style="font-size:15px; font-weight:bold; color:#38bdf8; margin-bottom:12px;" id="okr-obj"></div>
      <div id="okr-krs" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
    
    </div>
    <footer class="tool-footer">Ngôi Nhà Số Enterprise • Bản Quyền Tuấn Phạm</footer>
  </div>
  <script>
  (function() {
    document.addEventListener('DOMContentLoaded', function() {
      const b = document.getElementById('btn-back-main');
      if (b) {
        b.addEventListener('click', function(e) {
          if (window.parent && window.parent !== window) {
            e.preventDefault();
            window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
          } else {
            window.location.href = '../index.html';
          }
        });
      }
    });
  })();
  
    const okrDb = {
      sales: {
        o: "🎯 Mục tiêu: Đột phá doanh thu xưởng và mở rộng 20 đại lý mới",
        kr: [
          { t: "Đạt mốc doanh số 1.5 Tỷ đồng", p: 75 },
          { t: "Ký hợp đồng với 20 đại lý phân phối gốm men mới", p: 50 },
          { t: "Tăng tỷ lệ khách hàng cũ quay lại mua từ 25% lên 40%", p: 85 }
        ]
      },
      mkt: {
        o: "🎯 Mục tiêu: Tăng nhận diện thương hiệu và phủ sóng mạng xã hội",
        kr: [
          { t: "Đạt 50.000 lượt theo dõi trang Fanpage/TikTok", p: 60 },
          { t: "Mang về 500 khách hàng tiềm năng (Leads) cho team Sales", p: 80 },
          { t: "Chi phí trên mỗi khách hàng (CPA) giảm dưới 50.000đ", p: 90 }
        ]
      },
      prod: {
        o: "🎯 Mục tiêu: Tối ưu quy trình lò nung, giảm tỷ lệ hàng hỏng dưới 2%",
        kr: [
          { t: "Sản lượng xuất xưởng đạt 10.000 sản phẩm loại 1", p: 95 },
          { t: "Tỷ lệ phế phẩm nứt men giảm từ 5% xuống dưới 2%", p: 70 },
          { t: "Tiết kiệm 10% chi phí điện/gas lò nung mỗi mẻ", p: 65 }
        ]
      },
      hr: {
        o: "🎯 Mục tiêu: Chuẩn hóa đội ngũ nhân sự và văn hóa kỷ luật",
        kr: [
          { t: "Tuyển dụng đủ 100% định biên nhân sự xưởng", p: 90 },
          { t: "100% nhân viên hoàn thành khóa đào tạo 5S và an toàn", p: 100 },
          { t: "Chỉ số gắn kết nhân viên đạt trên 85%", p: 80 }
        ]
      }
    };
    
    document.getElementById('btn-gen-okr').addEventListener('click', () => {
      const dept = document.getElementById('okr-dept').value;
      const data = okrDb[dept];
      document.getElementById('okr-obj').textContent = data.o;
      
      const krContainer = document.getElementById('okr-krs');
      krContainer.innerHTML = "";
      data.kr.forEach((item, idx) => {
        const div = document.createElement('div');
        div.style.background = "rgba(255,255,255,0.05)";
        div.style.padding = "12px 16px";
        div.style.borderRadius = "10px";
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:#fff;">
            <span>KR ${idx+1}: ${item.t}</span>
            <span style="color:#38bdf8;">${item.p}%</span>
          </div>
          <div style="width:100%; height:8px; background:#1e293b; border-radius:99px; margin-top:8px; overflow:hidden;">
            <div style="width:${item.p}%; height:100%; background:linear-gradient(90deg, #38bdf8, #10b981); border-radius:99px;"></div>
          </div>
        `;
        krContainer.appendChild(div);
      });
      document.getElementById('okr-res').style.display = 'block';
    });
    
  </script>
</body>
</html>
