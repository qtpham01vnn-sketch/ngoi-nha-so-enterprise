<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biên Bản Bàn Giao Tài Sản - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-slate-400 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-white flex items-center gap-3">
          <i class="fa-solid fa-file-contract"></i> Tạo Biên Bản Bàn Giao Tài Sản & Thiết Bị
        </h1>
        <p class="text-sm text-slate-400 mt-1">Biên bản bàn giao chuẩn mẫu pháp lý doanh nghiệp, in hoặc sao chép 1 click</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <h2 class="font-bold text-white border-b border-slate-700 pb-2">Thông tin bàn giao</h2>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Bên giao (Họ tên / Chức vụ)</label>
          <input id="giver" value="Nguyễn Văn A - Quản lý CSVC" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Bên nhận (Họ tên / Chức vụ)</label>
          <input id="receiver" value="Trần Thị B - Nhân viên Kế toán" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Danh sách tài sản (Mỗi dòng 1 món)</label>
          <textarea id="items" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-xs outline-none">1. Laptop Dell XPS 15 - Serial: DL123894 - Tình trạng: Mới 98% kèm sạc
2. Màn hình Dell 24 inch 4K - Tình trạng: Hoạt động tốt
3. Thẻ ra vào văn phòng số: 042</textarea>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Địa điểm & Ngày bàn giao</label>
          <input id="locationDate" value="Văn phòng Hà Nội, ngày 15/09/2026" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
        <button onclick="renderDoc()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 font-bold text-white rounded-xl transition">Cập nhật biên bản</button>
      </div>

      <div class="card p-6 rounded-2xl space-y-4 bg-slate-900/90 text-slate-200 text-xs font-mono border border-slate-700">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <span class="font-bold text-emerald-400">XEM TRƯỚC VĂN BẢN</span>
          <button onclick="copyDoc()" class="px-3 py-1 bg-emerald-700 hover:bg-emerald-600 text-white rounded text-xs"><i class="fa-solid fa-copy"></i> Sao chép</button>
        </div>
        <pre id="docPreview" class="whitespace-pre-wrap font-sans text-xs leading-relaxed text-slate-300"></pre>
      </div>
    </div>
  </div>

  <script>
    function renderDoc() {
      const g = document.getElementById('giver').value;
      const r = document.getElementById('receiver').value;
      const items = document.getElementById('items').value;
      const loc = document.getElementById('locationDate').value;

      const content = `CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM
Độc lập - Tự do - Hạnh phúc
---o0o---

BIÊN BẢN BÀN GIAO TÀI SẢN & THIẾT BỊ

Hôm nay, ${loc}, chúng tôi gồm có:

I. BÊN GIAO:
- Đại diện: ${g}

II. BÊN NHẬN:
- Đại diện: ${r}

Hai bên cùng tiến hành bàn giao các tài sản, trang thiết bị phục vụ công việc sau:
${items}

CAM KẾT:
1. Bên nhận chịu trách nhiệm bảo quản, sử dụng tài sản đúng mục đích công việc.
2. Khi nghỉ việc hoặc có yêu cầu thu hồi, bên nhận có nghĩa vụ bàn giao lại nguyên trạng.

Biên bản được lập thành 02 bản có giá trị pháp lý như nhau, mỗi bên giữ 01 bản.

      ĐẠI DIỆN BÊN GIAO                  ĐẠI DIỆN BÊN NHẬN
      (Ký & ghi rõ họ tên)               (Ký & ghi rõ họ tên)`;

      document.getElementById('docPreview').innerText = content;
    }

    function copyDoc() {
      navigator.clipboard.writeText(document.getElementById('docPreview').innerText);
      alert('Đã sao chép nội dung biên bản bàn giao!');
    }

    renderDoc();
  </script>
</body>
</html>
