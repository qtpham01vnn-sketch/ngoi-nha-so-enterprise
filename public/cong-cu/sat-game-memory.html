<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Luyện Trí Nhớ Ghép Cặp Icon Thần Tốc (Memory Match) — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #0b132b; --bg-card: #131f47; --border: rgba(56, 189, 248, 0.25);
      --text: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3);
      --emerald: #10b981; --rose: #f43f5e; --amber: #f59e0b; --indigo: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-page); color: var(--text); padding-bottom: 40px; min-height: 100vh; }
    .app-wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--border); transition: all 0.2s; cursor: pointer; }
    .back-link:hover { background: rgba(56, 189, 248, 0.2); }
    .badge { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); font-weight: bold; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-field { width: 100%; padding: 12px 14px; background: #080e22; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
    .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-rose { background: linear-gradient(135deg, #e11d48, #f43f5e); color: #fff; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
    .btn-emerald { background: linear-gradient(135deg, #059669, #10b981); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-amber { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; }
    .btn-copy { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-copy:hover { background: rgba(56, 189, 248, 0.3); }
    .result-box { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; }
    .res-val { font-size: 28px; font-weight: 900; color: #fff; margin: 8px 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a class="back-link" id="btn-back-main">← Quay lại Bảng điều khiển</a>
      <span class="badge">🎮 Rèn Luyện Não Bộ</span>
    </nav>
    <div class="card">
      
    <div class="card-title">🧠 Game Luyện Trí Nhớ Ghép Cặp (Memory Match)</div>
    <div class="card-desc">Lật mở từng cặp ô tìm các biểu tượng giống nhau để kích hoạt khả năng ghi nhớ ngắn hạn của não bộ.</div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <div>Số lượt lật: <strong id="m-moves" style="color:#38bdf8;">0</strong></div>
      <div>Cặp đã tìm: <strong id="m-pairs" style="color:#10b981;">0 / 8</strong></div>
      <button class="btn btn-primary" id="btn-reset-m" style="width:120px; padding:8px 12px; font-size:12px;">Chơi lại</button>
    </div>
    <div id="memory-grid" class="grid-2" style="grid-template-columns: repeat(4, 1fr); gap:10px; max-width:440px; margin:0 auto;">
      <!-- Memory Cards -->
    </div>
    
    </div>
    <footer class="tool-footer">Ngôi Nhà Số Enterprise • Bản Quyền Tuấn Phạm</footer>
  </div>
  <script>
  (function() {
    document.addEventListener('DOMContentLoaded', function() {
      const b = document.getElementById('btn-back-main');
      if (b) {
        b.addEventListener('click', function(e) {
          if (window.parent && window.parent !== window) {
            e.preventDefault();
            window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
          } else {
            window.location.href = '../index.html';
          }
        });
      }
    });
  })();
  
    const icons = ['🔥', '⭐', '💎', '🚀', '❤️', '👑', '⚡', '🍀'];
    let deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
    let flipped = [];
    let matched = 0;
    let moves = 0;
    
    const grid = document.getElementById('memory-grid');
    
    function init() {
      grid.innerHTML = "";
      deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
      flipped = [];
      matched = 0;
      moves = 0;
      document.getElementById('m-moves').textContent = "0";
      document.getElementById('m-pairs').textContent = "0 / 8";
      
      deck.forEach((icon, idx) => {
        const card = document.createElement('div');
        card.style.height = "70px";
        card.style.background = "linear-gradient(135deg, #1e293b, #0f172a)";
        card.style.border = "1px solid rgba(255,255,255,0.15)";
        card.style.borderRadius = "12px";
        card.style.display = "flex";
        card.style.alignItems = "center";
        card.style.justifyContent = "center";
        card.style.fontSize = "26px";
        card.style.cursor = "pointer";
        card.dataset.icon = icon;
        card.dataset.index = idx;
        
        card.addEventListener('click', () => {
          if (card.classList.contains('open') || flipped.length >= 2) return;
          card.textContent = icon;
          card.classList.add('open');
          card.style.background = "#38bdf820";
          card.style.borderColor = "#38bdf8";
          flipped.push(card);
          
          if (flipped.length === 2) {
            moves++;
            document.getElementById('m-moves').textContent = moves;
            if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
              matched++;
              document.getElementById('m-pairs').textContent = `${matched} / 8`;
              flipped[0].style.background = "#10b98130";
              flipped[0].style.borderColor = "#10b981";
              flipped[1].style.background = "#10b98130";
              flipped[1].style.borderColor = "#10b981";
              flipped = [];
              if (matched === 8) {
                alert(`🎉 CHÚC MỪNG! Bạn đã hoàn thành trong ${moves} lượt lật!`);
              }
            } else {
              setTimeout(() => {
                flipped[0].textContent = "";
                flipped[0].classList.remove('open');
                flipped[0].style.background = "linear-gradient(135deg, #1e293b, #0f172a)";
                flipped[0].style.borderColor = "rgba(255,255,255,0.15)";
                flipped[1].textContent = "";
                flipped[1].classList.remove('open');
                flipped[1].style.background = "linear-gradient(135deg, #1e293b, #0f172a)";
                flipped[1].style.borderColor = "rgba(255,255,255,0.15)";
                flipped = [];
              }, 800);
            }
          }
        });
        grid.appendChild(card);
      });
    }
    
    document.getElementById('btn-reset-m').addEventListener('click', init);
    init();
    
  </script>
</body>
</html>
