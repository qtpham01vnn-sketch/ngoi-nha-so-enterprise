<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Chữ Ký Email Chuyên Nghiệp - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-sky-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-sky-400 flex items-center gap-3">
          <i class="fa-solid fa-signature"></i> Tạo Chữ Ký Email HTML Doanh Nghiệp
        </h1>
        <p class="text-sm text-slate-400 mt-1">Điền thông tin và sao chép định dạng chữ ký sang Gmail/Outlook chỉ với 1 click</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <div class="card p-6 rounded-2xl space-y-4">
        <h2 class="font-bold text-white border-b border-slate-700 pb-2">Thông tin cá nhân & Công ty</h2>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Họ và tên</label>
          <input id="sigName" value="TUẤN PHẠM" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Chức danh / Vị trí</label>
          <input id="sigTitle" value="Founder & Giám Đốc Điều Hành" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Tên Doanh nghiệp / Tổ chức</label>
          <input id="sigCompany" value="Ngôi Nhà Số Enterprise" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Số điện thoại / Hotline</label>
          <input id="sigPhone" value="0988 888 888" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Email / Website</label>
          <input id="sigEmail" value="contact@ngoinhaso.vn | www.ngoinhaso.vn" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-semibold outline-none">
        </div>
      </div>

      <div class="card p-6 rounded-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <h2 class="font-bold text-white">Xem trước chữ ký</h2>
          <button onclick="copySignature()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 font-bold text-white rounded-xl text-xs transition"><i class="fa-solid fa-copy"></i> Sao chép chữ ký</button>
        </div>

        <div id="sigPreview" class="p-6 bg-white text-slate-800 rounded-xl shadow-lg font-sans">
          <table style="font-family: Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #333333;">
            <tr>
              <td style="padding-right: 16px; border-right: 2px solid #0284c7; vertical-align: middle;">
                <div style="width: 56px; height: 56px; border-radius: 50%; background: #0284c7; color: #ffffff; font-weight: bold; font-size: 20px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 56px;">TP</div>
              </td>
              <td style="padding-left: 16px;">
                <div id="pvName" style="font-size: 16px; font-weight: bold; color: #0f172a;">TUẤN PHẠM</div>
                <div id="pvTitle" style="font-size: 13px; color: #0284c7; font-weight: 600;">Founder & Giám Đốc Điều Hành</div>
                <div id="pvCompany" style="font-size: 12px; color: #64748b; font-weight: bold; margin-top: 2px;">Ngôi Nhà Số Enterprise</div>
                <div style="font-size: 12px; color: #475569; margin-top: 4px;">
                  📞 <span id="pvPhone">0988 888 888</span><br>
                  ✉️ <span id="pvEmail">contact@ngoinhaso.vn | www.ngoinhaso.vn</span>
                </div>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateSig() {
      document.getElementById('pvName').innerText = document.getElementById('sigName').value;
      document.getElementById('pvTitle').innerText = document.getElementById('sigTitle').value;
      document.getElementById('pvCompany').innerText = document.getElementById('sigCompany').value;
      document.getElementById('pvPhone').innerText = document.getElementById('sigPhone').value;
      document.getElementById('pvEmail').innerText = document.getElementById('sigEmail').value;
    }
    function copySignature() {
      const container = document.getElementById('sigPreview');
      window.getSelection().selectAllChildren(container);
      document.execCommand('copy');
      alert('Đã sao chép chữ ký! Bạn có thể dán (Ctrl + V) trực tiếp vào cài đặt chữ ký Gmail/Outlook.');
    }
    document.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateSig));
    updateSig();
  </script>
</body>
</html>
