<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đo Thời Gian Phản Xạ - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-xl w-full space-y-6 text-center">
    <div class="card p-6 rounded-2xl border-l-4 border-amber-500 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-xl font-black text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-stopwatch-20"></i> Đo Tốc Độ Phản Xạ (Mili-giây)
        </h1>
        <p class="text-xs text-slate-400 mt-1">Bấm chuột ngay khi màn hình chuyển sang màu XANH LÁ</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div id="gameBox" onclick="handleClick()" class="w-full h-72 bg-rose-900/60 border-2 border-rose-500 rounded-3xl flex flex-col items-center justify-center cursor-pointer shadow-2xl transition select-none">
      <div id="gameText" class="text-2xl font-black text-white">Bấm vào đây để BẮT ĐẦU</div>
      <div id="subText" class="text-xs text-slate-300 mt-2">Chờ màu xanh xuất hiện...</div>
    </div>
  </div>

  <script>
    let state = 'idle'; // idle, waiting, ready
    let startTime = 0;
    let timeoutId = null;

    function handleClick() {
      const box = document.getElementById('gameBox');
      const text = document.getElementById('gameText');
      const sub = document.getElementById('subText');

      if (state === 'idle') {
        state = 'waiting';
        box.className = 'w-full h-72 bg-amber-900/80 border-2 border-amber-500 rounded-3xl flex flex-col items-center justify-center cursor-pointer shadow-2xl transition select-none';
        text.innerText = 'Đang chuẩn bị... Chờ màu xanh!';
        sub.innerText = 'Đừng bấm vội!';
        const delay = Math.floor(Math.random() * 3000) + 1500;
        timeoutId = setTimeout(() => {
          state = 'ready';
          startTime = Date.now();
          box.className = 'w-full h-72 bg-emerald-600 border-2 border-emerald-400 rounded-3xl flex flex-col items-center justify-center cursor-pointer shadow-2xl transition select-none';
          text.innerText = 'BẤM NGAY BÂY GIỜ!';
          sub.innerText = 'Nhanh tay lên!';
        }, delay);
      } else if (state === 'waiting') {
        clearTimeout(timeoutId);
        state = 'idle';
        box.className = 'w-full h-72 bg-rose-900/60 border-2 border-rose-500 rounded-3xl flex flex-col items-center justify-center cursor-pointer shadow-2xl transition select-none';
        text.innerText = 'Quá sớm rồi! 😅';
        sub.innerText = 'Bấm để thử lại';
      } else if (state === 'ready') {
        const reactionTime = Date.now() - startTime;
        state = 'idle';
        box.className = 'w-full h-72 bg-sky-900/80 border-2 border-sky-400 rounded-3xl flex flex-col items-center justify-center cursor-pointer shadow-2xl transition select-none';
        text.innerText = `${reactionTime} ms!`;
        sub.innerText = reactionTime < 250 ? '⚡ Phản xạ siêu đẳng như game thủ!' : '👍 Tốc độ phản xạ rất tốt. Bấm để thử lại!';
      }
    }
  </script>
</body>
</html>
