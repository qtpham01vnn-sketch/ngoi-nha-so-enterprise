<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bốc Thăm & Chia Đội — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; }
    .app-wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .form-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 20px; margin-bottom: 24px; }
    .btn { padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; min-height: 44px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .team-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C73 • Chia đội công bằng</span>
    </nav>
    <div style="font-size:22px; font-weight:700; margin-bottom:16px;">Chia nhóm & Bốc thăm ngẫu nhiên</div>
    <div class="form-card">
      <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">Danh sách thành viên (mỗi dòng một tên):</label>
      <textarea id="inp-names" rows="5" style="width:100%; padding:10px; border:1px solid var(--border-subtle); border-radius:6px; font-size:14px;">Tuấn
Nam
Linh
Hùng
Dũng
Mai</textarea>
      <div style="display:flex; align-items:center; gap:12px; margin-top:12px;">
        <span>Chia thành:</span>
        <input type="number" id="inp-teams-count" value="2" min="2" max="10" style="width:60px; padding:8px; border:1px solid var(--border-subtle); border-radius:4px;">
        <span>đội</span>
        <button class="btn btn-primary" id="btn-split" style="margin-left:auto;">🎲 Chia đội ngẫu nhiên</button>
      </div>
    </div>
    <div id="teams-output"></div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    document.getElementById('btn-split').addEventListener('click', () => {
      let list = document.getElementById('inp-names').value.split('\n').map(x => x.trim()).filter(Boolean);
      const k = parseInt(document.getElementById('inp-teams-count').value, 10) || 2;
      if (list.length === 0) return;
      // Shuffle
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      const teams = Array.from({ length: k }, () => []);
      list.forEach((member, i) => {
        teams[i % k].push(member);
      });
      document.getElementById('teams-output').innerHTML = teams.map((team, idx) => `
        <div class="team-box">
          <strong style="color:var(--accent); font-size:16px;">Đội ${idx + 1} (${team.length} thành viên):</strong>
          <div style="margin-top:6px; font-size:15px;">• ${team.join(', ')}</div>
        </div>
      `).join('');
    });
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
