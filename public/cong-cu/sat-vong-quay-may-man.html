<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng Quay May Mắn - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    #wheel { transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-xl w-full space-y-6 text-center">
    <div class="card p-6 rounded-2xl border-l-4 border-amber-500 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-xl font-black text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-dharmachakra"></i> Vòng Quay May Mắn Team Building
        </h1>
        <p class="text-xs text-slate-400 mt-1">Quay ngẫu nhiên phần thưởng & mini-game cho hội nhóm</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-8 rounded-3xl flex flex-col items-center space-y-6">
      <div class="relative flex items-center justify-center">
        <div class="absolute -top-3 z-20 text-3xl text-rose-500"><i class="fa-solid fa-caret-down"></i></div>
        <canvas id="wheel" width="300" height="300" class="rounded-full shadow-2xl border-4 border-amber-400"></canvas>
      </div>

      <button onclick="spinWheel()" class="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition flex items-center gap-2">
        <i class="fa-solid fa-rotate"></i> QUAY THƯỞNG NGAY
      </button>

      <div id="resultText" class="text-lg font-black text-emerald-400 min-h-[28px]"></div>
    </div>
  </div>

  <script>
    const items = ['Trúng 500k 💵', 'Chúc may mắn 🍀', 'Voucher 200k 🎁', 'Uống 1 ly 🍻', 'Hát 1 bài 🎤', 'Ôm người bên cạnh ❤️'];
    const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#64748b'];
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;

    function drawWheel() {
      const arc = (2 * Math.PI) / items.length;
      for (let i = 0; i < items.length; i++) {
        const angle = i * arc;
        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.arc(150, 150, 150, angle, angle + arc);
        ctx.lineTo(150, 150);
        ctx.fill();

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Segoe UI';
        ctx.translate(150 + Math.cos(angle + arc / 2) * 90, 150 + Math.sin(angle + arc / 2) * 90);
        ctx.rotate(angle + arc / 2 + Math.PI / 2);
        ctx.fillText(items[i], -ctx.measureText(items[i]).width / 2, 0);
        ctx.restore();
      }
    }

    function spinWheel() {
      const extraRounds = Math.floor(Math.random() * 5 + 5) * 360;
      const randomDeg = Math.floor(Math.random() * 360);
      currentAngle += extraRounds + randomDeg;
      document.getElementById('wheel').style.transform = `rotate(${currentAngle}deg)`;
      setTimeout(() => {
        document.getElementById('resultText').innerText = '🎉 Chúc mừng bạn đã trúng thưởng!';
      }, 4000);
    }

    drawWheel();
  </script>
</body>
</html>
