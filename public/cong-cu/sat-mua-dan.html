<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồ Cần Mua Dần — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88; --danger: #b91c1c;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; font-variant-numeric: tabular-nums; }
    .app-wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .hero-card { background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 14px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .item-row { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; }
    .item-row.done { background: var(--bg-subtle); text-decoration: line-through; opacity: 0.6; }
    .form-input { padding: 10px 14px; border: 1px solid var(--border-subtle); border-radius: 6px; font-size: 15px; flex: 1; min-height: 44px; }
    .btn { padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; min-height: 44px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C21 • Đồ cần mua</span>
    </nav>
    <div class="hero-card">
      <div>
        <div style="font-size:13px; font-weight:700; color:var(--accent); text-transform:uppercase;">CẦN MUA KHI ĐI SIÊU THỊ</div>
        <div style="font-size:14px; color:var(--text-muted); margin-top:4px;">Ghi nhớ ngay khi nghĩ ra</div>
      </div>
      <div style="font-size:36px; font-weight:800; color:var(--accent);" id="pending-count">0 món</div>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <input type="text" class="form-input" id="inp-item" placeholder="Nhập món cần mua (Enter để thêm)...">
      <button class="btn btn-primary" id="btn-add">+ Thêm</button>
    </div>
    <div id="items-list"></div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    const STORAGE_KEY = 'nns_tool_mua_dan_data';
    let items = [{ id: 1, text: 'Kem đánh răng', done: false }, { id: 2, text: 'Dầu ăn 5L', done: false }];
    try { const raw = localStorage.getItem(STORAGE_KEY); if(raw) items = JSON.parse(raw); }catch(e){}
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    function render() {
      const pending = items.filter(x => !x.done).length;
      document.getElementById('pending-count').textContent = `${pending} món`;
      document.getElementById('items-list').innerHTML = items.map((it, idx) => `
        <div class="item-row ${it.done ? 'done' : ''}" onclick="toggleDone(${idx})">
          <span>${it.done ? '✓ ' : '○ '} <strong>${it.text}</strong></span>
          <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="event.stopPropagation(); delItem(${idx})">✕</button>
        </div>
      `).join('');
    }
    window.toggleDone = function(idx) { items[idx].done = !items[idx].done; save(); render(); };
    window.delItem = function(idx) { items.splice(idx, 1); save(); render(); };
    function addItem() {
      const inp = document.getElementById('inp-item');
      if (!inp.value.trim()) return;
      items.unshift({ id: Date.now(), text: inp.value.trim(), done: false });
      save(); render(); inp.value = ''; inp.focus();
    }
    document.getElementById('btn-add').addEventListener('click', addItem);
    document.getElementById('inp-item').addEventListener('keydown', (e) => { if(e.key === 'Enter') addItem(); });
    render();
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
