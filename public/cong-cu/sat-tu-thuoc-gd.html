<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ Theo Dõi Tủ Thuốc Gia Đình - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-rose-500 flex justify-between items-center flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-black text-rose-400 flex items-center gap-3">
          <i class="fa-solid fa-kit-medical"></i> Sổ Theo Dõi Tủ Thuốc Gia Đình
        </h1>
        <p class="text-sm text-slate-400 mt-1">Quản lý hạn dùng, liều lượng và cảnh báo thuốc cần bổ sung cho gia đình</p>
      </div>
      <a href="../index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 transition">← Trang Chủ</a>
    </div>

    <div class="card p-6 rounded-2xl space-y-4">
      <h2 class="font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-rose-400"></i> Thêm loại thuốc vào tủ
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Tên thuốc / Dụng cụ</label>
          <input id="medName" placeholder="vd: Panadol Extra..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none focus:border-rose-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Công dụng</label>
          <input id="medUse" placeholder="vd: Hạ sốt, giảm đau" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none focus:border-rose-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Liều dùng</label>
          <input id="medDose" placeholder="vd: 1 viên/lần, cách 4-6h" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none focus:border-rose-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Hạn sử dụng</label>
          <input id="medExp" type="date" value="2027-12-31" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-sm outline-none focus:border-rose-500">
        </div>
      </div>
      <div class="flex justify-end">
        <button onclick="addMed()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 font-bold text-white text-sm rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-check"></i> Lưu vào tủ thuốc
        </button>
      </div>
    </div>

    <div class="card p-6 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-list-check text-rose-400"></i> Danh mục thuốc hiện có (<span id="medCount">4</span>)
        </h2>
      </div>
      <div class="overflow-x-auto rounded-xl border border-slate-800">
        <table class="w-full text-xs text-left text-slate-300">
          <thead class="bg-slate-900 text-slate-400 uppercase">
            <tr>
              <th class="p-3">Tên thuốc</th>
              <th class="p-3">Công dụng</th>
              <th class="p-3">Liều dùng</th>
              <th class="p-3">Hạn sử dụng</th>
              <th class="p-3">Trạng thái</th>
              <th class="p-3 text-center">Thao tác</th>
            </tr>
          </thead>
          <tbody id="medListBody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let medicines = [
      { id: 1, name: 'Paracetamol 500mg', use: 'Hạ sốt, giảm đau', dose: '1-2 viên/lần, cách 4-6h', exp: '2027-08-15' },
      { id: 2, name: 'Oresol hương cam', use: 'Bù nước, điện giải khi sốt', dose: 'Pha đúng 200ml nước', exp: '2028-01-20' },
      { id: 3, name: 'Berberin', use: 'Rối loạn tiêu hóa', dose: '2-4 viên/lần sau ăn', exp: '2026-11-30' },
      { id: 4, name: 'Nước muối 0.9%', use: 'Rửa mũi họng', dose: 'Hàng ngày', exp: '2027-05-10' }
    ];

    function renderMedicines() {
      document.getElementById('medCount').innerText = medicines.length;
      document.getElementById('medListBody').innerHTML = medicines.map(m => `
        <tr class="hover:bg-slate-800/40">
          <td class="p-3 font-bold text-white">${m.name}</td>
          <td class="p-3 text-slate-300">${m.use}</td>
          <td class="p-3 text-slate-400">${m.dose}</td>
          <td class="p-3 font-mono">${m.exp}</td>
          <td class="p-3"><span class="px-2 py-0.5 bg-emerald-950 text-emerald-400 rounded">Còn hạn tốt</span></td>
          <td class="p-3 text-center">
            <button onclick="removeMed(${m.id})" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function addMed() {
      const name = document.getElementById('medName').value.trim();
      const use = document.getElementById('medUse').value.trim();
      const dose = document.getElementById('medDose').value.trim();
      const exp = document.getElementById('medExp').value;
      if (!name) return alert('Vui lòng nhập tên thuốc!');
      medicines.push({ id: Date.now(), name, use: use || 'Thông dụng', dose: dose || 'Theo chỉ định', exp });
      document.getElementById('medName').value = '';
      document.getElementById('medUse').value = '';
      document.getElementById('medDose').value = '';
      renderMedicines();
    }

    function removeMed(id) {
      medicines = medicines.filter(m => m.id !== id);
      renderMedicines();
    }

    renderMedicines();
  </script>
</body>
</html>
