<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giải Nghĩa Giấy Tờ & Hợp Đồng — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; }
    .app-wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .term-item { border-bottom: 1px solid var(--border-subtle); padding: 12px 0; }
    .term-item:last-child { border-bottom: none; }
    .term-title { font-weight: 700; color: var(--accent); font-size: 15px; margin-bottom: 4px; }
    .term-desc { font-size: 14px; color: var(--text-main); line-height: 1.5; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C63 • Thuật ngữ giấy tờ</span>
    </nav>
    <div style="font-size:22px; font-weight:700; margin-bottom:8px;">Tra cứu thuật ngữ hợp đồng & ngân hàng</div>
    <p style="font-size:14px; color:var(--text-muted); margin-bottom:16px;">Giải thích bằng lời thường, dễ hiểu, không dùng từ luật học rối rắm.</p>
    <input type="text" id="inp-search" placeholder="Gõ từ cần tra (vd: bất khả kháng, đơn phương, tất toán)..." style="width:100%; padding:12px 14px; border:1px solid var(--border-subtle); border-radius:8px; font-size:15px; margin-bottom:16px;">
    <div class="card" id="terms-list"></div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    const dict = [
      { t: 'Bất khả kháng (Force Majeure)', d: 'Những sự việc khách quan không lường trước được và không thể khắc phục dù đã làm hết cách (như thiên tai, động đất, dịch bệnh lớn). Khi xảy ra, bên bị ảnh hưởng không bị phạt vi phạm hợp đồng.' },
      { t: 'Đơn phương chấm dứt hợp đồng', d: 'Một bên tự ý hủy hợp đồng mà không cần bên kia đồng ý. Nếu không có lý do hợp pháp quy định trong hợp đồng thì phải bồi thường thiệt hại.' },
      { t: 'Tất toán hợp đồng / khoản vay', d: 'Trả hết toàn bộ số tiền gốc, tiền lãi và các loại phí còn lại để kết thúc hoàn toàn hợp đồng vay vốn hoặc gửi tiết kiệm.' },
      { t: 'Thời hiệu khởi kiện', d: 'Khoảng thời gian tối đa mà pháp luật cho phép bạn nộp đơn kiện ra tòa án. Hết thời gian này thì tòa án không nhận thụ lý giải quyết tranh chấp nữa.' },
      { t: 'Phạt cọc và mất cọc', d: 'Bên nhận cọc từ chối giao dịch thì phải trả lại tiền cọc và đền thêm một khoản tương đương (phạt cọc). Bên đặt cọc từ chối giao dịch thì mất số tiền đã đặt cọc.' }
    ];
    function render(list) {
      document.getElementById('terms-list').innerHTML = list.map(item => `
        <div class="term-item">
          <div class="term-title">${item.t}</div>
          <div class="term-desc">${item.d}</div>
        </div>
      `).join('');
    }
    document.getElementById('inp-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = dict.filter(x => x.t.toLowerCase().includes(q) || x.d.toLowerCase().includes(q));
      render(filtered);
    });
    render(dict);
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
