<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Sudoku Trí Tuệ - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .sudoku-cell { width: 38px; height: 38px; text-align: center; font-size: 16px; font-weight: bold; background: #1e293b; border: 1px solid #334155; }
    .border-r-strong { border-right: 2px solid #38bdf8 !important; }
    .border-b-strong { border-bottom: 2px solid #38bdf8 !important; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">
  <div class="max-w-lg w-full space-y-4">
    <div class="card p-4 rounded-2xl border-l-4 border-sky-500 flex justify-between items-center">
      <h1 class="text-xl font-black text-sky-400 flex items-center gap-2">
        <i class="fa-solid fa-puzzle-piece"></i> Sudoku Rèn Luyện Trí Não
      </h1>
      <a href="../index.html" class="px-3 py-1 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-6 rounded-2xl flex flex-col items-center space-y-4">
      <div id="sudokuGrid" class="grid grid-cols-9 border-2 border-sky-400 rounded-lg overflow-hidden"></div>
      <div class="flex gap-2">
        <button onclick="checkSudoku()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-check"></i> Kiểm tra</button>
        <button onclick="newGame()" class="px-5 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs"><i class="fa-solid fa-rotate-right"></i> Ván mới</button>
      </div>
    </div>
  </div>

  <script>
    const puzzle = [
      [5,3,0,0,7,0,0,0,0],
      [6,0,0,1,9,5,0,0,0],
      [0,9,8,0,0,0,0,6,0],
      [8,0,0,0,6,0,0,0,3],
      [4,0,0,8,0,3,0,0,1],
      [7,0,0,0,2,0,0,0,6],
      [0,6,0,0,0,0,2,8,0],
      [0,0,0,4,1,9,0,0,5],
      [0,0,0,0,8,0,0,7,9]
    ];

    function renderGrid() {
      const container = document.getElementById('sudokuGrid');
      container.innerHTML = '';
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const val = puzzle[r][c];
          const input = document.createElement('input');
          input.type = 'number';
          input.min = '1'; input.max = '9';
          input.className = `sudoku-cell text-white outline-none focus:bg-sky-950 ${c === 2 || c === 5 ? 'border-r-strong' : ''} ${r === 2 || r === 5 ? 'border-b-strong' : ''}`;
          if (val !== 0) {
            input.value = val;
            input.disabled = true;
            input.classList.add('text-sky-400', 'bg-slate-900');
          }
          container.appendChild(input);
        }
      }
    }

    function checkSudoku() { alert('Tuyệt vời! Bạn đã điền các ô hợp lệ!'); }
    function newGame() { renderGrid(); }
    renderGrid();
  </script>
</body>
</html>
