<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lắc Xúc Xắc 3D Ngẫu Nhiên - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-md w-full space-y-6 text-center">
    <div class="card p-6 rounded-2xl border-l-4 border-rose-500 flex justify-between items-center">
      <div class="text-left">
        <h1 class="text-xl font-black text-rose-400 flex items-center gap-2">
          <i class="fa-solid fa-dice"></i> Lắc Xúc Xắc Boardgame
        </h1>
        <p class="text-xs text-slate-400 mt-1">Tung 2 viên xúc xắc ngẫu nhiên cho trò chơi gia đình</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-8 rounded-3xl flex flex-col items-center space-y-6">
      <div class="flex gap-6 text-7xl text-white">
        <div id="dice1" class="w-24 h-24 bg-rose-600 rounded-2xl flex items-center justify-center shadow-2xl border-2 border-rose-400"><i class="fa-solid fa-dice-six"></i></div>
        <div id="dice2" class="w-24 h-24 bg-rose-600 rounded-2xl flex items-center justify-center shadow-2xl border-2 border-rose-400"><i class="fa-solid fa-dice-three"></i></div>
      </div>

      <div id="totalDice" class="text-2xl font-black text-rose-300">Tổng điểm: 9</div>

      <button onclick="rollDice()" class="px-8 py-3 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-xl shadow-lg transition flex items-center gap-2">
        <i class="fa-solid fa-dice-d20"></i> LẮC XÚC XẮC
      </button>
    </div>
  </div>

  <script>
    const icons = ['', 'fa-dice-one', 'fa-dice-two', 'fa-dice-three', 'fa-dice-four', 'fa-dice-five', 'fa-dice-six'];
    function rollDice() {
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice1').innerHTML = `<i class="fa-solid ${icons[d1]}"></i>`;
      document.getElementById('dice2').innerHTML = `<i class="fa-solid ${icons[d2]}"></i>`;
      document.getElementById('totalDice').innerText = `Tổng điểm: ${d1 + d2}`;
    }
  </script>
</body>
</html>
