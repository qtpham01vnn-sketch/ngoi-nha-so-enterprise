<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máy Bốc Thăm Khỏi Tranh Cãi — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #f9f8f6; --bg-surface: #ffffff; --bg-subtle: #f3f1ec; --border-subtle: #e5e1d8;
      --text-main: #242220; --text-muted: #68645e; --accent: #2d5a88;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); color: var(--text-main); font-family: var(--font-family); padding-bottom: 40px; text-align: center; }
    .app-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; text-align: left; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--border-subtle); min-height: 40px; }
    .hero-card { background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 14px; padding: 36px 20px; margin-bottom: 24px; }
    .hero-result { font-size: 38px; font-weight: 800; color: var(--accent); margin: 12px 0; }
    .btn { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid transparent; min-height: 48px; font-size: 16px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a href="../ngoi-nha-so.html" class="back-link">← Về Ngôi nhà số</a>
      <span style="font-size:13px; color:var(--text-muted);">C36 • Bốc thăm công bằng</span>
    </nav>
    <div class="hero-card">
      <div style="font-size:13px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">KẾT QUẢ BỐC THĂM NGẪU NHIÊN</div>
      <div class="hero-result" id="res-name">Bấm nút để chọn!</div>
      <div style="margin-top:20px;">
        <button class="btn btn-primary" id="btn-spin">🎲 Bốc thăm ngay</button>
      </div>
    </div>
    <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:10px; padding:16px; text-align:left;">
      <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">Danh sách người / việc cần chọn (mỗi dòng một mục):</label>
      <textarea id="inp-items" rows="5" style="width:100%; padding:10px; border:1px solid var(--border-subtle); border-radius:6px; font-size:14px;">Bố
Mẹ
Tuấn
Linh</textarea>
    </div>
    <footer class="tool-footer">Thuộc hệ <a href="../ngoi-nha-so.html">Ngôi nhà số</a> • Quy tắc Bản 1</footer>
  </div>
  <script>
  (function() {
    document.getElementById('btn-spin').addEventListener('click', () => {
      const lines = document.getElementById('inp-items').value.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) { alert('Vui lòng nhập danh sách!'); return; }
      let count = 0;
      const interval = setInterval(() => {
        const rand = lines[Math.floor(Math.random() * lines.length)];
        document.getElementById('res-name').textContent = rand;
        count++;
        if (count > 15) clearInterval(interval);
      }, 80);
    });
  })();
  </script>

<script>
// Enterprise App Integration
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.back-link, a[href*="ngoi-nha-so"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        if (window.parent && window.parent !== window) {
          e.preventDefault();
          window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
        }
      });
    });
  });
})();
</script>

</body>
</html>
