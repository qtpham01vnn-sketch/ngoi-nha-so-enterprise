<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Công Nợ Khách Hàng & Phân Loại Tuổi Nợ (Aging) — Ngôi Nhà Số</title>
  <style>
    :root {
      --bg-page: #0b132b; --bg-card: #131f47; --border: rgba(56, 189, 248, 0.2);
      --text: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3);
      --emerald: #10b981; --rose: #f43f5e; --amber: #f59e0b; --indigo: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-page); color: var(--text); padding-bottom: 40px; min-height: 100vh; }
    .app-wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--border); transition: all 0.2s; cursor: pointer; }
    .back-link:hover { background: rgba(56, 189, 248, 0.2); }
    .badge { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-field { width: 100%; padding: 12px 14px; background: #080e22; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
    .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-rose { background: linear-gradient(135deg, #e11d48, #f43f5e); color: #fff; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
    .btn-emerald { background: linear-gradient(135deg, #059669, #10b981); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-copy { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-copy:hover { background: rgba(56, 189, 248, 0.3); }
    .result-box { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; }
    .res-val { font-size: 28px; font-weight: 900; color: #fff; margin: 8px 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    .tool-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <nav class="top-nav">
      <a class="back-link" id="btn-back-main">← Quay lại Bảng điều khiển</a>
      <span class="badge">💼 Quản Lý Công Nợ</span>
    </nav>
    <div class="card">
      
    <div class="card-title">📑 Sổ Theo Dõi Công Nợ & Kịch Bản Nhắc Nợ Lịch Sự</div>
    <div class="card-desc">Theo dõi các khoản phải thu theo tuổi nợ (Dưới 30 ngày, 30-60 ngày, Quá hạn >60 ngày) và tự động tạo tin nhắn đòi nợ tinh tế.</div>
    <div class="grid-2">
      <div class="input-group">
        <label class="input-label">Tên khách hàng / Đại lý:</label>
        <input type="text" id="deb-name" class="input-field" value="Đại lý Gốm Sứ Minh Tâm">
      </div>
      <div class="input-group">
        <label class="input-label">Số tiền nợ (VNĐ):</label>
        <input type="number" id="deb-amount" class="input-field" value="45000000" step="1000000">
      </div>
      <div class="input-group">
        <label class="input-label">Số ngày đã quá hạn:</label>
        <input type="number" id="deb-days" class="input-field" value="15" min="0">
      </div>
      <div class="input-group">
        <label class="input-label">Số hóa đơn / Hợp đồng:</label>
        <input type="text" id="deb-invoice" class="input-field" value="HD-2026/09-XUONG">
      </div>
    </div>
    <button class="btn btn-amber" id="btn-gen-debt">✉️ Tạo Tin Nhắn Nhắc Nợ Tự Động</button>
    <div id="debt-res" class="result-box" style="display:none; text-align:left;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:bold; color:#f59e0b;">MẪU TIN NHẮN GỬI ZALO / EMAIL:</span>
        <button class="btn-copy" id="btn-copy-debt">Sao chép</button>
      </div>
      <div id="debt-msg" style="font-size:13px; color:#fff; line-height:1.6; background:rgba(0,0,0,0.3); padding:14px; border-radius:10px; white-space:pre-wrap;"></div>
    </div>
    
    </div>
    <footer class="tool-footer">Ngôi Nhà Số Enterprise • Bản Quyền Tuấn Phạm</footer>
  </div>
  <script>
  (function() {
    document.addEventListener('DOMContentLoaded', function() {
      const b = document.getElementById('btn-back-main');
      if (b) {
        b.addEventListener('click', function(e) {
          if (window.parent && window.parent !== window) {
            e.preventDefault();
            window.parent.postMessage('CLOSE_TOOL_MODAL', '*');
          } else {
            window.location.href = '../index.html';
          }
        });
      }
    });
  })();
  
    function fmt(n) { return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' đ'; }
    document.getElementById('btn-gen-debt').addEventListener('click', () => {
      const name = document.getElementById('deb-name').value.trim() || 'Quý khách';
      const amt = parseFloat(document.getElementById('deb-amount').value) || 0;
      const days = parseInt(document.getElementById('deb-days').value) || 0;
      const inv = document.getElementById('deb-invoice').value.trim() || 'Hóa đơn';
      
      let msg = "";
      if (days <= 0) {
        msg = `Kính gửi ${name},\n\nKế toán Ngôi Nhà Số xin gửi lời chúc sức khỏe và may mắn tới Quý khách!\n\nChúng tôi xin gửi thông tin đối soát đơn hàng ${inv} với tổng giá trị ${fmt(amt)}, thời hạn thanh toán là ngày mai. Nhờ Quý khách sắp xếp đối chiếu và chuyển khoản giúp công ty theo số tài khoản:\n• Ngân hàng: MB Bank\n• STK: 0988888888 (Tuan Pham)\n\nTrân trọng cảm ơn sự hợp tác của Quý khách!`;
      } else if (days <= 30) {
        msg = `Chào ${name},\n\nEm bên bộ phận kế toán xin phép nhắc nhẹ về khoản thanh toán đơn hàng ${inv} trị giá ${fmt(amt)} hiện đã quá hạn ${days} ngày ạ. Do công ty đang chốt sổ công nợ tháng để nhập nguyên vật liệu mới, nhờ anh/chị hỗ trợ giải ngân thanh toán giúp em trong hôm nay hoặc ngày mai với ạ! Em cảm ơn nhiều ạ.`;
      } else {
        msg = `KÍNH GỬI BAN GIÁM ĐỐC ${name.toUpperCase()},` +
        `\n\nTheo hợp đồng kinh tế ${inv}, khoản công nợ trị giá ${fmt(amt)} của Quý khách hiện đã quá hạn ${days} ngày mặc dù hai bên đã nhiều lần trao đổi. Để không làm gián đoạn việc cung cấp hàng hóa cho các lô tiếp theo, kính đề nghị Quý khách hoàn tất thanh toán chậm nhất trước 17h00 ngày mai. Rất mong nhận được sự hợp tác thiện chí từ Quý công ty!`;
      }
      
      document.getElementById('debt-msg').textContent = msg;
      document.getElementById('debt-res').style.display = 'block';
    });
    
    document.getElementById('btn-copy-debt').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('debt-msg').textContent);
      alert('Đã sao chép tin nhắn nhắc nợ!');
    });
    
  </script>
</body>
</html>
