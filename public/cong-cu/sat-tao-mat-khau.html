<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinh Mật Khẩu Siêu An Toàn - Ngôi Nhà Số</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center">
  <div class="max-w-lg w-full space-y-6">
    <div class="card p-6 rounded-2xl border-l-4 border-emerald-500 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-black text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-shield-halved"></i> Sinh Mật Khẩu Siêu An Toàn
        </h1>
        <p class="text-xs text-slate-400 mt-1">Chuẩn bảo mật quân đội, chống dò quét Brute-force</p>
      </div>
      <a href="../index.html" class="px-3 py-1.5 bg-slate-800 text-xs font-bold rounded-xl text-slate-300">← Trang Chủ</a>
    </div>

    <div class="card p-6 rounded-2xl space-y-4">
      <div class="relative">
        <input id="pwdOutput" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-lg font-mono font-bold text-emerald-400 outline-none pr-12">
        <button onclick="copyPwd()" class="absolute right-3 top-3 text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-copy"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <div class="flex justify-between text-slate-300 mb-1">
            <span>Độ dài mật khẩu:</span>
            <span id="lenVal" class="font-bold text-emerald-400">16 ký tự</span>
          </div>
          <input id="pwdLen" type="range" min="8" max="32" value="16" class="w-full accent-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-2 p-2 bg-slate-900/60 rounded-lg cursor-pointer"><input type="checkbox" id="chkUpper" checked class="accent-emerald-500"> Chữ hoa (A-Z)</label>
          <label class="flex items-center gap-2 p-2 bg-slate-900/60 rounded-lg cursor-pointer"><input type="checkbox" id="chkLower" checked class="accent-emerald-500"> Chữ thường (a-z)</label>
          <label class="flex items-center gap-2 p-2 bg-slate-900/60 rounded-lg cursor-pointer"><input type="checkbox" id="chkNum" checked class="accent-emerald-500"> Chữ số (0-9)</label>
          <label class="flex items-center gap-2 p-2 bg-slate-900/60 rounded-lg cursor-pointer"><input type="checkbox" id="chkSym" checked class="accent-emerald-500"> Ký tự đặc biệt (!@#$)</label>
        </div>
      </div>

      <button onclick="genPwd()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-xl shadow-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrows-rotate"></i> Tạo Mật Khẩu Mới
      </button>
    </div>
  </div>

  <script>
    function genPwd() {
      const len = parseInt(document.getElementById('pwdLen').value);
      document.getElementById('lenVal').innerText = len + ' ký tự';
      const u = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const l = 'abcdefghijklmnopqrstuvwxyz';
      const n = '0123456789';
      const s = '!@#$%^&*()_+~|}{[]:;?><,./-=';

      let chars = '';
      if (document.getElementById('chkUpper').checked) chars += u;
      if (document.getElementById('chkLower').checked) chars += l;
      if (document.getElementById('chkNum').checked) chars += n;
      if (document.getElementById('chkSym').checked) chars += s;
      if (!chars) chars = l + n;

      let res = '';
      for (let i = 0; i < len; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('pwdOutput').value = res;
    }

    function copyPwd() {
      navigator.clipboard.writeText(document.getElementById('pwdOutput').value);
      alert('Đã sao chép mật khẩu an toàn!');
    }

    document.querySelectorAll('input').forEach(inp => inp.addEventListener('input', genPwd));
    genPwd();
  </script>
</body>
</html>
